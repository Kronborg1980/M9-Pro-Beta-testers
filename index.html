<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anthbot M9 Pro — Beta Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06120E;--panel:rgba(255,255,255,.045);--panel-2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09);--stroke-lit:rgba(180,240,74,.25);
  --txt:#E9F4EE;--txt-2:#B6CDC1;--muted:#7A9789;
  --lime:#B4F04A;--teal:#37D6A8;--amber:#FFC24B;--coral:#FF6A5A;--violet:#A78BFA;--sky:#5AC8FA;
  --r:16px;--rs:10px;
  --display:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:70vh;z-index:-2;pointer-events:none;
  background:radial-gradient(50% 55% at 20% 10%,rgba(55,214,168,.18),transparent 70%),radial-gradient(45% 50% at 82% 5%,rgba(180,240,74,.13),transparent 70%);filter:blur(20px)}
body::after{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:repeating-linear-gradient(101deg,rgba(255,255,255,.016) 0 64px,rgba(0,0,0,0) 64px 128px)}
::selection{background:var(--lime);color:#08150F}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

header.top{position:sticky;top:0;z-index:60;height:62px;display:flex;align-items:center;gap:14px;padding:0 max(18px,env(safe-area-inset-left));
  background:rgba(6,18,14,.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--stroke)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:10px;position:relative;background:linear-gradient(150deg,var(--lime),var(--teal));box-shadow:0 8px 20px -8px rgba(55,214,168,.8)}
.mark::after{content:"";position:absolute;inset:7px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(6,18,14,.85) 0 2px,transparent 2px 5px)}
.brand h1{font-family:var(--display);font-size:14.5px;margin:0;font-weight:600;white-space:nowrap}
.brand .sub{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;gap:3px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:500;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--txt);background:var(--panel)}
.tab[aria-current=true]{background:var(--lime);color:#08150F;font-weight:600}
.app{max-width:1180px;margin:0 auto;padding:0 18px 120px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--panel);border:1px solid var(--stroke);
  padding:9px 14px;border-radius:var(--rs);cursor:pointer;font-size:13.5px;font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:var(--stroke-lit)}
.btn.primary{background:linear-gradient(140deg,var(--lime),#8FDB3C);color:#08150F;border-color:transparent;font-weight:600}
.btn.ghost{background:none}
.btn.danger{color:var(--coral);border-color:rgba(255,106,90,.3)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pad{padding:18px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.key{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h2.sec{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
hr.sep{border:0;border-top:1px solid var(--stroke);margin:16px 0}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--txt-2);margin-bottom:6px}
label.f .hint{font-weight:400;color:var(--muted);font-size:11.5px}
input[type=text],input[type=email],input[type=date],textarea,select{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--stroke);border-radius:var(--rs);padding:10px 12px;font-size:14px}
textarea{resize:vertical;min-height:90px;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:var(--lime);outline:none}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
option{background:#0C1F18}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

.sev-critical{color:var(--coral);background:rgba(255,106,90,.13);border-color:rgba(255,106,90,.3)}
.sev-major{color:var(--amber);background:rgba(255,194,75,.12);border-color:rgba(255,194,75,.28)}
.sev-minor{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--stroke)}
.t-bug{color:var(--coral);background:rgba(255,106,90,.12)}
.t-safety{color:#fff;background:rgba(255,60,60,.38);border-color:rgba(255,106,90,.6)}
.t-feature{color:var(--violet);background:rgba(167,139,250,.14)}
.t-other{color:var(--sky);background:rgba(90,200,250,.12)}
.st-new{color:var(--lime);background:rgba(180,240,74,.13)}
.st-looking{color:var(--violet);background:rgba(167,139,250,.14)}
.st-need-info{color:var(--amber);background:rgba(255,194,75,.12)}
.st-fixed{color:var(--teal);background:rgba(55,214,168,.14)}
.st-verified{color:#08150F;background:var(--teal)}
.st-not-planned{color:var(--muted);background:rgba(255,255,255,.05)}

.hero{position:relative;overflow:hidden;border-radius:20px;margin:20px 0 18px;border:1px solid var(--stroke);
  background:linear-gradient(160deg,rgba(55,214,168,.10),rgba(6,18,14,.2) 60%);padding:24px}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(101deg,rgba(180,240,74,.055) 0 46px,transparent 46px 92px)}
.hero h2{font-family:var(--display);font-size:clamp(22px,3.6vw,32px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:8px 0 6px}
.hero h2 em{font-style:normal;color:var(--lime)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:18px}
.stat{background:rgba(0,0,0,.3);border:1px solid var(--stroke);border-radius:12px;padding:12px 13px}
.stat .n{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:5px}
.stat.alert{border-color:rgba(255,106,90,.4);background:rgba(255,106,90,.08)}
.stat.alert .n{color:var(--coral)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 14px}
.search{position:relative;flex:1;min-width:190px}
.search input{padding-left:34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
.toolbar select{width:auto;min-width:130px;padding:9px 30px 9px 12px;font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:14px;padding:14px 16px;cursor:pointer;border-radius:var(--r);
  border:1px solid var(--stroke);background:var(--panel);transition:.15s}
.item:hover{background:var(--panel-2);border-color:var(--stroke-lit)}
.item.pinned{border-color:rgba(180,240,74,.35);background:linear-gradient(100deg,rgba(180,240,74,.07),transparent 45%)}
.item.crit{box-shadow:inset 3px 0 0 var(--coral)}
.vote{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--stroke);
  background:rgba(0,0,0,.3);padding:8px 0;cursor:pointer;transition:.15s}
.vote:hover{border-color:var(--lime)}
.vote.on{background:rgba(180,240,74,.15);border-color:var(--lime);color:var(--lime)}
.vote .v{font-family:var(--display);font-size:16px;font-weight:700;line-height:1}
.vote .lbl{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-top:2px}
.item h3{font-family:var(--display);font-size:15.5px;font-weight:600;margin:0 0 6px}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;justify-content:center}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty .big{font-family:var(--display);font-size:18px;color:var(--txt);margin-bottom:6px}
.avatar{width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;font-family:var(--display);color:#08150F}

.scrim{position:fixed;inset:0;background:rgba(2,8,6,.72);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);z-index:100;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0B1F18,#071510);border-left:1px solid var(--stroke);
  transform:translateX(102%);transition:transform .26s cubic-bezier(.3,.9,.3,1);box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
.panel.open{transform:none}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--stroke);display:flex;gap:12px;align-items:flex-start}
.panel-body{overflow:auto;padding:20px;flex:1;overscroll-behavior:contain}
.panel-foot{padding:12px 20px;border-top:1px solid var(--stroke);display:flex;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.25)}
.close-x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;padding:2px 8px;border-radius:8px}
.close-x:hover{color:var(--txt);background:var(--panel)}
.block{background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:12px;padding:13px 15px;margin:12px 0}
.block h4{font-family:var(--display);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.pre{white-space:pre-wrap;font-size:13.5px;line-height:1.6;margin:0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0}
.staffbox{border:1px solid rgba(55,214,168,.3);background:linear-gradient(160deg,rgba(55,214,168,.08),transparent);border-radius:14px;padding:15px;margin:14px 0}
.comment{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.badge-staff{background:var(--teal);color:#08150F;font-size:9.5px;padding:1px 6px;border-radius:5px;font-weight:700;text-transform:uppercase;margin-left:6px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--stroke);cursor:zoom-in}
.dupwarn{background:rgba(255,194,75,.09);border:1px solid rgba(255,194,75,.35);border-radius:12px;padding:11px 13px;margin-bottom:14px}
.dupwarn .d{padding:6px 0;cursor:pointer;font-size:13px;border-bottom:1px solid rgba(255,255,255,.06)}
.dupwarn .d:last-child{border:0}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input{appearance:none;width:36px;height:20px;border-radius:100px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:.2s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--txt);transition:.2s}
.switch input:checked{background:var(--lime)}
.switch input:checked::after{left:18px;background:#08150F}

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
table.data th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:9px 10px;
  border-bottom:1px solid var(--stroke);font-weight:600;white-space:nowrap;position:sticky;top:0;background:#0A1A14}
table.data td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover td{background:rgba(255,255,255,.04)}
.subtabs{display:flex;gap:4px;margin:16px 0 14px;flex-wrap:wrap}
.subtab{background:var(--panel);border:1px solid var(--stroke);padding:7px 13px;border-radius:100px;cursor:pointer;font-size:13px;color:var(--muted)}
.subtab[aria-current=true]{background:var(--teal);color:#08150F;border-color:transparent;font-weight:600}
.rel{border-left:2px solid var(--stroke);padding:0 0 20px 20px;position:relative;margin-left:8px}
.rel::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(180,240,74,.12)}
.rel.beta::before{background:var(--amber);box-shadow:0 0 0 4px rgba(255,194,75,.12)}
.ver{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--lime)}
.fixlist{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.fixlist li{display:flex;gap:9px;align-items:center;font-size:13px;padding:7px 10px;background:rgba(0,0,0,.25);border-radius:9px;border:1px solid var(--stroke)}

.fab{position:fixed;right:18px;bottom:18px;z-index:70;border-radius:100px;padding:14px 20px;font-size:14px;box-shadow:0 16px 40px -12px rgba(180,240,74,.7)}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(11,31,24,.97);border:1px solid var(--stroke-lit);border-radius:12px;padding:11px 16px;font-size:13.5px;animation:pop .25s cubic-bezier(.2,1.2,.4,1)}
.toast.bad{border-color:rgba(255,106,90,.5)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.lightbox{position:fixed;inset:0;z-index:150;background:rgba(2,8,6,.94);display:none;place-items:center;padding:20px;cursor:zoom-out}
.lightbox.open{display:grid}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.tagpill{background:rgba(255,255,255,.06);border:1px solid var(--stroke);padding:2px 8px;border-radius:7px;font-size:11px;font-family:var(--mono);color:var(--txt-2)}
.locked{text-align:center;padding:60px 20px}

@media(max-width:640px){
  .app{padding:0 14px 120px}
  .grid2{grid-template-columns:1fr}
  .brand h1{display:none}
  .item{grid-template-columns:48px 1fr}
  .item .right{grid-column:2;flex-direction:row}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{margin-bottom:8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"></div>
    <div><h1>Anthbot M9 Pro</h1><div class="sub">Beta reports</div></div>
  </div>
  <nav id="tabs">
    <button class="tab" data-view="reports">Reports</button>
    <button class="tab" data-view="updates">Updates</button>
    <button class="tab" data-view="you">You</button>
    <button class="tab" data-view="admin" id="tabAdmin" hidden>Admin</button>
  </nav>
</header>

<main class="app">
  <section id="view-reports" hidden></section>
  <section id="view-updates" hidden></section>
  <section id="view-you" hidden></section>
  <section id="view-admin" hidden></section>
</main>

<button class="btn primary fab" id="fabNew">+ New report</button>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true">
  <div class="panel-head" id="pHead"></div>
  <div class="panel-body" id="pBody"></div>
  <div class="panel-foot" id="pFoot"></div>
</aside>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* ==================================================================
   ANTHBOT M9 PRO — BETA REPORTING
   Single file, no build step. All persistence goes through Store
   (localStorage today, Firebase later — see the note at the bottom).
   ================================================================== */

const TYPES={
  bug     :{label:'Bug',            cls:'t-bug'},
  safety  :{label:'Safety',         cls:'t-safety'},
  feature :{label:'Feature request', cls:'t-feature'},
  other   :{label:'Question / other',cls:'t-other'}
};
const SEV={
  critical:{label:'Critical',cls:'sev-critical',w:3,help:'Unusable, damages something, or someone could get hurt'},
  major   :{label:'Major',   cls:'sev-major',   w:2,help:'A main function fails and there is no way around it'},
  minor   :{label:'Minor',   cls:'sev-minor',   w:1,help:'Annoying or cosmetic'}
};
const ST={
  'new'        :{label:'New',              cls:'st-new',        open:true},
  'looking'    :{label:'Anthbot is on it',  cls:'st-looking',    open:true},
  'need-info'  :{label:'Needs more info',   cls:'st-need-info',  open:true},
  'fixed'      :{label:'Fixed in update',   cls:'st-fixed',      open:false},
  'verified'   :{label:'Verified fixed',    cls:'st-verified',   open:false},
  'not-planned':{label:'Not planned',       cls:'st-not-planned',open:false}
};
const AREAS=['Mowing & navigation','Cutting deck & blades','Docking & charging','Battery & runtime',
  'Obstacle & safety sensors','Rain & weather','Mobile app','Wi-Fi & connection','Noise','Manual & setup','Something else'];

/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
function ago(t){const d=(Date.now()-t)/1000;
  if(d<60)return'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';
  if(d<604800)return Math.floor(d/86400)+'d ago';return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function fdate(t){return new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h;}
function avatar(n){const i=String(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return `<span class="avatar" style="background:hsl(${hue(n)} 70% 62%)">${esc(i)}</span>`;}
function chip(c,l,dot){return `<span class="chip ${c}">${dot?'<span class="dot"></span>':''}${esc(l)}</span>`;}
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');
  t.textContent=(bad?'⚠️ ':'✓ ')+m;$('#toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.3s';t.style.opacity=0;setTimeout(()=>t.remove(),300);},2600);}

/* ---------------- store ---------------- */
const Store={
  KEY:'anthbot_m9_v2',_mem:null,
  _ok(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}},
  async load(){if(this._ok()){try{const r=localStorage.getItem(this.KEY);return r?JSON.parse(r):null}catch(e){return null}}return this._mem},
  async save(s){if(this._ok()){try{localStorage.setItem(this.KEY,JSON.stringify(s));return true}
    catch(e){toast('Storage is full — export your data',true);return false}}this._mem=s;return true},
  async clear(){if(this._ok())localStorage.removeItem(this.KEY);this._mem=null},
  mode(){return this._ok()?'this browser':'this session only'}
};

let S=null;
const ui={view:'reports',q:'',fStatus:'',fType:'',sort:'votes',openId:null,files:[],adminTab:'reports'};

function blank(){return{v:2,profile:{id:uid(),name:'',email:'',serial:'',region:'',lawn:'',firmware:'2.4.1',app:'3.8.0',role:'tester',joined:Date.now(),lastSeen:Date.now()},
  testers:{},reports:[],updates:[],notice:null,counter:0};}
const isAdmin=()=>S.profile.role==='admin';
const byId=id=>S.reports.find(r=>r.id===id);
const isOpen=r=>ST[r.status].open;
const myVote=r=>r.votes.includes(S.profile.id);
const score=r=>(r.votes.length+1)*(SEV[r.severity]?.w||1);
async function persist(){await Store.save(S);}

/* every report carries a snapshot of who filed it, so admins never
   have to join two tables by hand */
function reporterCard(){
  const p=S.profile;
  return {id:p.id,name:p.name||'Unnamed tester',email:p.email||'',serial:p.serial||'',
          region:p.region||'',lawn:p.lawn||'',firmware:p.firmware||'',app:p.app||''};
}
function syncTester(){
  const p=S.profile;
  S.testers[p.id]=Object.assign({},reporterCard(),{joined:p.joined||Date.now(),lastSeen:Date.now()});
}

/* ---------------- router ---------------- */
function go(v){
  ui.view=v;
  $$('#tabs .tab').forEach(t=>t.setAttribute('aria-current',String(t.dataset.view===v)));
  $$('main > section').forEach(s=>s.hidden=true);
  const el=$('#view-'+v); el.hidden=false;
  ({reports:viewReports,updates:viewUpdates,you:viewYou,admin:viewAdmin}[v])(el);
  location.hash=v;
}
function refresh(){ $('#tabAdmin').hidden=!isAdmin(); go(ui.view); }

/* ---------------- reports ---------------- */
function itemHTML(r){
  return `<article class="item ${r.pinned?'pinned':''} ${r.severity==='critical'&&isOpen(r)?'crit':''}" data-id="${r.id}" tabindex="0">
    <button class="vote ${myVote(r)?'on':''}" data-vote="${r.id}" aria-pressed="${myVote(r)}" title="I have this too">
      <span class="v">${r.votes.length}</span><span class="lbl">same</span></button>
    <div style="min-width:0">
      <h3>${r.pinned?'📌 ':''}${esc(r.title)}</h3>
      <div class="meta">
        <span class="key">${esc(r.key)}</span>
        ${chip(TYPES[r.type].cls,TYPES[r.type].label)}
        ${r.type!=='feature'?chip(SEV[r.severity].cls,SEV[r.severity].label,true):''}
        ${chip(ST[r.status].cls,ST[r.status].label)}
        ${r.fixedIn?`<span class="tagpill">in ${esc(r.fixedIn)}</span>`:''}
        <span class="muted tiny">${esc(r.area)}</span>
      </div>
    </div>
    <div class="right">
      <span class="muted tiny">${esc(r.reporter.name)}</span>
      <span class="muted tiny">${ago(r.createdAt)}${r.comments.length?' · 💬 '+r.comments.length:''}</span>
    </div></article>`;
}
function listFiltered(){
  let l=S.reports.slice();
  const q=ui.q.toLowerCase().trim();
  if(q)l=l.filter(r=>(r.title+' '+r.body+' '+r.key+' '+r.area+' '+r.reporter.name).toLowerCase().includes(q));
  if(ui.fStatus==='__open')l=l.filter(isOpen); else if(ui.fStatus==='__closed')l=l.filter(r=>!isOpen(r));
  else if(ui.fStatus)l=l.filter(r=>r.status===ui.fStatus);
  if(ui.fType)l=l.filter(r=>r.type===ui.fType);
  const s={votes:(a,b)=>score(b)-score(a),new:(a,b)=>b.createdAt-a.createdAt,
    activity:(a,b)=>b.updatedAt-a.updatedAt,mine:(a,b)=>b.createdAt-a.createdAt}[ui.sort];
  l.sort(s); l.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  return l;
}
function viewReports(el){
  const open=S.reports.filter(isOpen), crit=open.filter(r=>r.severity==='critical');
  const waiting=S.reports.filter(r=>r.status==='fixed');
  const mine=S.reports.filter(r=>r.reporter.id===S.profile.id);
  const list=listFiltered();
  el.innerHTML=`
  <div class="hero">
    <div class="eyebrow">Closed beta · firmware ${esc(S.profile.firmware)}</div>
    <h2>${crit.length?`<em>${crit.length}</em> critical ${crit.length===1?'issue is':'issues are'} still open`:`Nothing critical open. <em>Keep breaking it.</em>`}</h2>
    <p class="muted" style="margin:0;max-width:58ch">Anything odd, annoying, dangerous or missing goes in here. If someone already reported it, hit <strong>same</strong> instead of writing it again.</p>
    <div class="stats">
      <div class="stat ${crit.length?'alert':''}"><div class="n">${crit.length}</div><div class="l">Critical open</div></div>
      <div class="stat"><div class="n">${open.length}</div><div class="l">Open reports</div></div>
      <div class="stat"><div class="n">${waiting.length}</div><div class="l">Fixed — please verify</div></div>
      <div class="stat"><div class="n">${mine.length}</div><div class="l">Filed by you</div></div>
    </div>
  </div>
  ${S.notice?`<div class="card pad" style="border-color:rgba(180,240,74,.35);background:linear-gradient(100deg,rgba(180,240,74,.08),transparent);margin-bottom:16px">
    <div class="eyebrow">From Anthbot</div><h2 class="sec" style="margin:6px 0">${esc(S.notice.title)}</h2>
    <p class="muted" style="margin:0">${nl(S.notice.body)}</p></div>`:''}
  <div class="toolbar">
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" id="q" placeholder="Search reports" value="${esc(ui.q)}"></div>
    <select id="fStatus">
      <option value="">Any status</option><option value="__open" ${ui.fStatus==='__open'?'selected':''}>Open only</option>
      <option value="__closed" ${ui.fStatus==='__closed'?'selected':''}>Closed only</option>
      ${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${ui.fStatus===k?'selected':''}>${v.label}</option>`).join('')}</select>
    <select id="flType"><option value="">Any kind</option>
      ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${ui.fType===k?'selected':''}>${v.label}</option>`).join('')}</select>
    <select id="sort">
      <option value="votes" ${ui.sort==='votes'?'selected':''}>Most affected</option>
      <option value="new" ${ui.sort==='new'?'selected':''}>Newest</option>
      <option value="activity" ${ui.sort==='activity'?'selected':''}>Last activity</option></select>
  </div>
  <div class="list">${list.map(itemHTML).join('')||`<div class="empty"><div class="big">Nothing here yet</div>File the thing you were about to search for.</div>`}</div>`;
  $('#q').oninput=e=>{ui.q=e.target.value;const l=listFiltered();
    $('.list',el).innerHTML=l.map(itemHTML).join('')||`<div class="empty"><div class="big">Nothing matches</div>Try fewer filters.</div>`;wire(el);};
  $('#fStatus').onchange=e=>{ui.fStatus=e.target.value;viewReports(el);};
  $('#flType').onchange=e=>{ui.fType=e.target.value;viewReports(el);};
  $('#sort').onchange=e=>{ui.sort=e.target.value;viewReports(el);};
  wire(el);
}
function wire(root){
  $$('.item',root).forEach(n=>{
    n.onclick=e=>{if(!e.target.closest('[data-vote]'))openReport(n.dataset.id);};
    n.onkeydown=e=>{if(e.key==='Enter')openReport(n.dataset.id);};
  });
  $$('[data-vote]',root).forEach(b=>b.onclick=e=>{e.stopPropagation();vote(b.dataset.vote);});
}
async function vote(id){
  const r=byId(id);if(!r)return;
  const i=r.votes.indexOf(S.profile.id);
  if(i>=0)r.votes.splice(i,1);else{r.votes.push(S.profile.id);toast(r.key+' now has '+r.votes.length+' testers on it');}
  r.updatedAt=Date.now();await persist();
  if(ui.openId===id)openReport(id);
  go(ui.view);
}

/* ---------------- report detail ---------------- */
function openReport(id){
  const r=byId(id);if(!r)return;
  ui.openId=id;
  const admin=isAdmin();
  $('#pHead').innerHTML=`<div style="min-width:0">
    <div class="row" style="gap:7px;margin-bottom:7px;flex-wrap:wrap">
      <span class="key">${esc(r.key)}</span>${chip(TYPES[r.type].cls,TYPES[r.type].label)}
      ${r.type!=='feature'?chip(SEV[r.severity].cls,SEV[r.severity].label,true):''}${chip(ST[r.status].cls,ST[r.status].label)}</div>
    <h2 class="sec" style="font-size:19px;line-height:1.25">${esc(r.title)}</h2>
    <div class="muted tiny" style="margin-top:6px">${esc(r.reporter.name)} · ${fdate(r.createdAt)}</div>
  </div><button class="close-x" id="pClose" aria-label="Close">×</button>`;

  $('#pBody').innerHTML=`
    ${r.reply?`<div class="block" style="border-color:rgba(55,214,168,.4);background:rgba(55,214,168,.07)">
      <h4>Anthbot says</h4><p class="pre">${nl(r.reply)}</p>
      ${r.fixedIn?`<div style="margin-top:9px">${chip('st-fixed','Fixed in '+r.fixedIn)}</div>`:''}</div>`:''}
    ${r.body?`<div class="block"><h4>What happened</h4><p class="pre">${nl(r.body)}</p></div>`:''}
    ${r.steps?`<div class="block"><h4>How to trigger it</h4><p class="pre">${nl(r.steps)}</p></div>`:''}
    ${r.files.length?`<div class="block"><h4>Photos</h4><div class="thumbs">${r.files.map(f=>`<img src="${f.data}" alt="${esc(f.name)}">`).join('')}</div></div>`:''}
    <div class="block"><h4>Details</h4><dl class="kv">
      <dt>Area</dt><dd>${esc(r.area)}</dd>
      <dt>Firmware</dt><dd class="key">${esc(r.reporter.firmware||'—')}</dd>
      <dt>App</dt><dd class="key">${esc(r.reporter.app||'—')}</dd>
      ${admin?`<dt>Serial</dt><dd class="key">${esc(r.reporter.serial||'—')}</dd>
      <dt>Email</dt><dd class="key">${esc(r.reporter.email||'—')}</dd>
      <dt>Region</dt><dd>${esc(r.reporter.region||'—')}</dd>
      <dt>Lawn</dt><dd>${esc(r.reporter.lawn||'—')} m²</dd>`:''}
    </dl></div>

    ${admin?`<div class="staffbox"><div class="eyebrow" style="color:var(--teal)">Anthbot controls</div>
      <div class="grid2" style="margin-top:12px">
        <label class="f"><span>Status</span><select id="aStatus">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v.label}</option>`).join('')}</select></label>
        <label class="f"><span>Fixed in update</span><input type="text" id="aFixed" value="${esc(r.fixedIn)}" placeholder="2.5.0"></label>
      </div>
      <label class="f"><span>Reply to the group <span class="hint">— shown at the top of this report</span></span>
        <textarea id="aReply" placeholder="What you found, what changed, what you need from testers.">${esc(r.reply)}</textarea></label>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn primary sm" id="aSave">Save</button>
        <label class="switch"><input type="checkbox" id="aPin" ${r.pinned?'checked':''}> Pin to top</label>
      </div></div>`:''}

    <div class="block"><h4>Replies (${r.comments.length})</h4>
      ${r.comments.map(c=>`<div class="comment">${avatar(c.by)}<div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px">${esc(c.by)}${c.role==='admin'?'<span class="badge-staff">Anthbot</span>':''}
          <span class="muted tiny" style="font-weight:400"> · ${ago(c.at)}</span></div>
        <p class="pre" style="margin-top:4px">${nl(c.text)}</p></div></div>`).join('')
        ||'<p class="muted tiny">No replies yet. Even “happens to me too, on flat ground” helps.</p>'}
      <textarea id="cText" placeholder="Add what you saw or a workaround" style="margin-top:12px"></textarea>
      <button class="btn primary sm" id="cAdd" style="margin-top:8px">Post reply</button>
    </div>`;

  $('#pFoot').innerHTML=`
    <button class="btn ${myVote(r)?'primary':''}" id="vBtn">${myVote(r)?'✓ You have this too':'I have this too'} · ${r.votes.length}</button>
    ${r.status==='fixed'?`<button class="btn" id="okBtn">It's fixed for me</button><button class="btn danger" id="badBtn">Still broken</button>`:''}
    ${(r.reporter.id===S.profile.id||admin)?`<button class="btn ghost sm danger" id="delBtn">Delete</button>`:''}`;

  open_();
  $('#pClose').onclick=closeAll;
  $('#vBtn').onclick=()=>vote(r.id);
  $$('#pBody img').forEach(i=>i.onclick=()=>{$('#lightboxImg').src=i.src;$('#lightbox').classList.add('open');});
  if($('#okBtn'))$('#okBtn').onclick=async()=>{r.status='verified';r.updatedAt=Date.now();await persist();openReport(id);go(ui.view);toast('Marked verified — thank you');};

  if($('#delBtn'))$('#delBtn').onclick=async()=>{if(!confirm('Delete '+r.key+'?'))return;

    await persist();openReport(id);go(ui.view);toast(r.key+' updated');};
}

/* ---------------- new report ---------------- */

  $('#pHead').innerHTML=`<div><div class="eyebrow">New report</div>
    <h2 class="sec" style="margin-top:6px">Tell Anthbot what you found</h2></div>
    <button class="close-x" id="pClose" aria-label="Close">×</button>`;
  $('#pBody').innerHTML=`
    <div id="dup"></div>
    <label class="f"><span>In one line, what happened?</span>
      <input type="text" id="fTitle" maxlength="110" placeholder="Blade stops in wet grass after 20 minutes"></label>
    <div class="grid2">
      <label class="f"><span>What kind of report</span><select id="fType">
        ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></label>
      <label class="f"><span>How bad is it</span><select id="fSev">
        ${Object.entries(SEV).map(([k,v])=>`<option value="${k}" ${k==='major'?'selected':''}>${v.label}</option>`).join('')}</select></label>
    </div>
    <p class="muted tiny" id="sevHelp" style="margin:-8px 0 14px"></p>
    <label class="f"><span>Which part of the mower</span><select id="fArea">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select></label>

      <textarea id="fBody" placeholder="Plain words are fine."></textarea></label>
    <label class="f"><span>How can Anthbot trigger it? <span class="hint">— optional, but it speeds up a fix a lot</span></span>
      <textarea id="fSteps" style="min-height:70px" placeholder="1. Start zone 2&#10;2. Wait for the north turn"></textarea></label>
    <label class="f"><span>Photos <span class="hint">— optional, under 1.5 MB each</span></span>
      <input type="file" id="fFiles" accept="image/*" multiple></label>
    <div class="thumbs" id="fThumbs"></div>
    <p class="muted tiny">Filed as <strong>${esc(S.profile.name||'Unnamed tester')}</strong>${S.profile.serial?' · unit '+esc(S.profile.serial):''} · firmware ${esc(S.profile.firmware||'—')}. Anthbot sees your name, email and serial with every report. Change it under <strong>You</strong>.</p>`;
  $('#pFoot').innerHTML=`<button class="btn ghost" id="fCancel">Cancel</button><button class="btn primary" id="fSave">Send report</button>`;
  open_();
  const help=()=>$('#sevHelp').textContent=SEV[$('#fSev').value].help;
  help();$('#fSev').onchange=help;

  $('#pClose').onclick=$('#fCancel').onclick=closeAll;

  $('#fThumbs').onclick=e=>{const i=e.target.dataset.rm;if(i!=null){ui.files.splice(+i,1);draw();}};
  $('#fFiles').onchange=async e=>{
    for(const f of [...e.target.files].slice(0,4)){
      if(f.size>1.6e6){toast(f.name+' is too big',true);continue;}
      ui.files.push({name:f.name,data:await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);})});
    }
    draw();e.target.value='';};
  $('#fTitle').oninput=()=>{
    const w=$('#fTitle').value.toLowerCase().split(/\s+/).filter(x=>x.length>3);
    if(w.length<2){$('#dup').innerHTML='';return;}
    const hits=S.reports.map(r=>({r,n:w.filter(x=>(r.title+' '+r.body).toLowerCase().includes(x)).length}))
      .filter(h=>h.n>=2).sort((a,b)=>b.n-a.n).slice(0,3);
    $('#dup').innerHTML=hits.length?`<div class="dupwarn"><strong>Someone may have this already</strong>
      <div class="muted tiny" style="margin:2px 0 6px">Voting on an existing report counts for more than a second copy.</div>
      ${hits.map(h=>`<div class="d" data-d="${h.r.id}">${esc(h.r.key)} — ${esc(h.r.title)} <span class="muted">· ${h.r.votes.length} testers</span></div>`).join('')}</div>`:'';
    $$('[data-d]').forEach(d=>d.onclick=()=>openReport(d.dataset.d));};
  $('#fSave').onclick=async()=>{
    const title=$('#fTitle').value.trim();
    if(!title){toast('One line about what happened, first',true);$('#fTitle').focus();return;}
    S.counter++;
    const r={id:uid(),key:'M9-'+String(S.counter).padStart(3,'0'),title,
      body:$('#fBody').value.trim(),steps:$('#fSteps').value.trim(),
      type:$('#fType').value,severity:$('#fSev').value,area:$('#fArea').value,
      status:'new',votes:[S.profile.id],comments:[],files:ui.files.slice(),
      reporter:reporterCard(),createdAt:Date.now(),updatedAt:Date.now(),
      pinned:false,fixedIn:'',reply:''};
    S.reports.unshift(r);syncTester();await persist();closeAll();go('reports');
    toast(r.key+' sent — thank you');setTimeout(()=>openReport(r.id),250);};
  setTimeout(()=>$('#fTitle').focus(),120);
}

/* ---------------- updates ---------------- */
function viewUpdates(el){
  const rels=[...S.updates].sort((a,b)=>b.date-a.date);
  el.innerHTML=`
    <div style="margin:22px 0 18px"><div class="eyebrow">Build log</div>
      <h2 class="sec" style="margin-top:6px">What Anthbot has shipped</h2>
      <p class="muted" style="margin:8px 0 0;max-width:60ch">When a report is fixed here, it turns up in Reports with a “Fixed in update” badge and a button for you to confirm it worked.</p></div>
    ${rels.map(u=>{
      const fx=u.fixes.map(byId).filter(Boolean);
      return `<div class="rel ${u.status==='beta'?'beta':''}">
        <div class="row" style="gap:9px;flex-wrap:wrap">
          <span class="ver">${u.channel==='app'?'App ':'Firmware '}${esc(u.version)}</span>
          ${chip(u.status==='released'?'st-fixed':'st-need-info',u.status==='released'?'Released':'Beta channel')}
          <span class="muted tiny">${new Date(u.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</span>
          ${isAdmin()?`<button class="btn sm ghost" data-del="${u.id}">Remove</button>`:''}
        </div>
        <p class="pre muted" style="margin:8px 0 0">${nl(u.notes)}</p>
        ${fx.length?`<ul class="fixlist">${fx.map(f=>`<li><span class="key">${esc(f.key)}</span>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.title)}</span>
          ${chip(ST[f.status].cls,ST[f.status].label)}<button class="btn sm ghost" data-o="${f.id}">Open</button></li>`).join('')}</ul>`:''}
      </div>`;}).join('')||'<div class="empty"><div class="big">No updates yet</div>Anthbot posts firmware and app releases here.</div>'}`;
  $$('[data-o]',el).forEach(b=>b.onclick=()=>openReport(b.dataset.o));
  $$('[data-del]',el).forEach(b=>b.onclick=async()=>{if(!confirm('Remove this update?'))return;
    S.updates=S.updates.filter(u=>u.id!==b.dataset.del);await persist();viewUpdates(el);});
}

/* ---------------- you ---------------- */

  el.innerHTML=`

    <h2 class="sec" style="margin-top:6px">Set this once — every report carries it</h2>
    <p class="muted" style="margin:8px 0 0;max-width:60ch">Anthbot needs your email and serial to match a report to a unit and get back to you. Other testers only see your name.</p></div>
  <div class="card pad" style="max-width:640px">
    <div class="grid2">
      <label class="f"><span>Name</span><input type="text" id="pName" value="${esc(p.name)}" placeholder="Lasse K."></label>
      <label class="f"><span>Email</span><input type="email" id="pEmail" value="${esc(p.email)}" placeholder="you@example.com"></label>
      <label class="f"><span>Unit serial number</span><input type="text" id="pSerial" value="${esc(p.serial)}" placeholder="M9P-0042"></label>
      <label class="f"><span>Country</span><input type="text" id="pRegion" value="${esc(p.region)}" placeholder="Denmark"></label>

    </div>
    <button class="btn primary" id="pSave">Save my details</button>
  </div>
  <div class="card pad" style="max-width:640px;margin-top:16px">
    <h2 class="sec">Anthbot staff</h2>
    <p class="muted tiny" style="margin:6px 0 12px">Saved on ${esc(Store.mode())}. Staff access unlocks the admin console.</p>
    <div class="row" style="flex-wrap:wrap">
      <span class="chip ${isAdmin()?'st-verified':'st-new'}">${isAdmin()?'Anthbot staff':'Tester'}</span>
      <button class="btn sm" id="roleBtn">${isAdmin()?'Sign out of admin':'Sign in as Anthbot'}</button>
      <button class="btn sm ghost" id="reseed">Reload demo data</button>
    </div>
  </div>`;
  $('#pSave').onclick=async()=>{

    // keep older reports of mine in sync with my current details
    S.reports.forEach(r=>{if(r.reporter.id===p.id)r.reporter=reporterCard();});

  $('#roleBtn').onclick=async()=>{
    if(!isAdmin()){
      const c=prompt('Anthbot staff code:');if(c===null)return;

/* ---------------- admin ---------------- */
function viewAdmin(el){
  if(!isAdmin()){el.innerHTML='<div class="locked"><div class="empty"><div class="big">Admin only</div>Sign in as Anthbot under “You”.</div></div>';return;}
  const T=Object.values(S.testers);
  const open=S.reports.filter(isOpen), crit=open.filter(r=>r.severity==='critical');
  const stale=open.filter(r=>Date.now()-r.updatedAt>7*86400000);
  el.innerHTML=`
  <div class="spread" style="margin:22px 0 4px">
    <div><div class="eyebrow">Anthbot console</div><h2 class="sec" style="margin-top:6px">Every report, every tester</h2></div>
    <div class="wrap">
      <button class="btn sm" id="xRep">Reports CSV</button>
      <button class="btn sm" id="xTest">Testers CSV</button>
      <button class="btn sm" id="xJson">Full backup</button>
    </div>
  </div>
  <div class="stats" style="margin:16px 0">
    <div class="stat ${crit.length?'alert':''}"><div class="n">${crit.length}</div><div class="l">Critical open</div></div>
    <div class="stat"><div class="n">${open.length}</div><div class="l">Open</div></div>
    <div class="stat"><div class="n">${S.reports.length}</div><div class="l">Total reports</div></div>
    <div class="stat"><div class="n">${T.length}</div><div class="l">Testers</div></div>
    <div class="stat"><div class="n">${stale.length}</div><div class="l">Untouched 7+ days</div></div>
  </div>
  <div class="subtabs">
    <button class="subtab" data-s="reports" ${ui.adminTab==='reports'?'aria-current=true':''}>All reports</button>
    <button class="subtab" data-s="testers" ${ui.adminTab==='testers'?'aria-current=true':''}>Testers &amp; units</button>
    <button class="subtab" data-s="publish" ${ui.adminTab==='publish'?'aria-current=true':''}>Publish an update</button>
    <button class="subtab" data-s="notice" ${ui.adminTab==='notice'?'aria-current=true':''}>Group notice</button>
  </div>
  <div id="adminBody"></div>`;
  $$('.subtab',el).forEach(b=>b.onclick=()=>{ui.adminTab=b.dataset.s;viewAdmin(el);});
  const body=$('#adminBody',el);
  if(ui.adminTab==='reports')adminReports(body);
  if(ui.adminTab==='testers')adminTesters(body);
  if(ui.adminTab==='publish')adminPublish(body);
  if(ui.adminTab==='notice')adminNotice(body);
  $('#xRep').onclick=exportReports;
  $('#xTest').onclick=exportTesters;
  $('#xJson').onclick=()=>dl('m9-backup-'+today()+'.json',JSON.stringify(S,null,2),'application/json');
}

    <thead><tr><th>ID</th><th>Title</th><th>Kind</th><th>Severity</th><th>Status</th><th>Same</th>
      <th>Tester</th><th>Email</th><th>Serial</th><th>Firmware</th><th>App</th><th>Region</th><th>Filed</th></tr></thead>

      <td style="max-width:280px">${esc(r.title)}</td>

      <td>${chip(SEV[r.severity].cls,SEV[r.severity].label)}</td>
      <td>${chip(ST[r.status].cls,ST[r.status].label)}</td>

function adminTesters(el){

      <td class="key">${esc(t.firmware||'—')}</td><td class="key">${esc(t.app||'—')}</td>

function adminPublish(el){
  const cands=S.reports.filter(r=>isOpen(r));
  el.innerHTML=`<div class="card pad" style="max-width:640px">
    <div class="grid2">
      <label class="f"><span>Version</span><input type="text" id="uVer" placeholder="2.5.0"></label>
      <label class="f"><span>Channel</span><select id="uCh"><option value="firmware">Firmware</option><option value="app">Mobile app</option></select></label>
      <label class="f"><span>State</span><select id="uSt"><option value="beta">Beta channel</option><option value="released">Released</option></select></label>
      <label class="f"><span>Date</span><input type="date" id="uDate" value="${new Date().toISOString().slice(0,10)}"></label>
    </div>
    <label class="f"><span>Release notes</span><textarea id="uNotes" placeholder="What changed, and what testers should re-check."></textarea></label>
    <label class="f"><span>Reports fixed in this update <span class="hint">— they flip to “Fixed in update” and testers get asked to confirm</span></span>
      <div style="max-height:230px;overflow:auto;border:1px solid var(--stroke);border-radius:12px;padding:10px">
        ${cands.map(r=>`<label class="switch" style="display:flex;padding:5px 0"><input type="checkbox" class="ufix" value="${r.id}">
          <span class="key">${esc(r.key)}</span><span style="flex:1">${esc(r.title)}</span></label>`).join('')||'<span class="muted tiny">Nothing open.</span>'}
      </div></label>
    <button class="btn primary" id="uSave">Publish update</button></div>`;
  $('#uSave').onclick=async()=>{
    const v=$('#uVer').value.trim();if(!v){toast('Version number first',true);return;}
    const fixes=$$('.ufix:checked').map(c=>c.value);
    S.updates.push({id:uid(),version:v,channel:$('#uCh').value,status:$('#uSt').value,
      date:new Date($('#uDate').value).getTime()||Date.now(),notes:$('#uNotes').value.trim(),fixes});
    fixes.forEach(id=>{const r=byId(id);if(r){r.status='fixed';r.fixedIn=v;r.updatedAt=Date.now();}});
    await persist();ui.adminTab='reports';refresh();toast('Update '+v+' published');};
}
function adminNotice(el){
  const n=S.notice||{title:'',body:''};
  el.innerHTML=`<div class="card pad" style="max-width:640px">
    <p class="muted tiny" style="margin:0 0 14px">Shown at the top of Reports for everyone. Leave the title empty to remove it.</p>
    <label class="f"><span>Headline</span><input type="text" id="nT" value="${esc(n.title)}"></label>
    <label class="f"><span>Message</span><textarea id="nB">${esc(n.body)}</textarea></label>
    <button class="btn primary" id="nSave">Save notice</button></div>`;
  $('#nSave').onclick=async()=>{
    const t=$('#nT').value.trim();
    S.notice=t?{title:t,body:$('#nB').value.trim()}:null;
    await persist();refresh();toast(t?'Notice posted':'Notice removed');};
}

/* ---------------- export ---------------- */
const today=()=>new Date().toISOString().slice(0,10);
function dl(name,text,type){const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href);}
const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function exportReports(){
  const head=['ID','Title','Kind','Severity','Status','Area','Same votes','Fixed in','Tester','Email','Serial','Region','Lawn m2','Firmware','App','Filed','Last activity','Description','Steps','Anthbot reply'];
  const rows=S.reports.map(r=>[r.key,r.title,TYPES[r.type].label,SEV[r.severity].label,ST[r.status].label,r.area,
    r.votes.length,r.fixedIn,r.reporter.name,r.reporter.email,r.reporter.serial,r.reporter.region,r.reporter.lawn,
    r.reporter.firmware,r.reporter.app,new Date(r.createdAt).toISOString(),new Date(r.updatedAt).toISOString(),
    r.body,r.steps,r.reply].map(cell).join(','));
  dl('m9-reports-'+today()+'.csv',head.join(',')+'\n'+rows.join('\n'),'text/csv');toast('Reports exported');
}
function exportTesters(){
  const head=['Name','Email','Serial','Region','Lawn m2','Firmware','App','Reports filed','Last seen'];
  const rows=Object.values(S.testers).map(t=>[t.name,t.email,t.serial,t.region,t.lawn,t.firmware,t.app,
    S.reports.filter(r=>r.reporter.id===t.id).length,t.lastSeen?new Date(t.lastSeen).toISOString():''].map(cell).join(','));
  dl('m9-testers-'+today()+'.csv',head.join(',')+'\n'+rows.join('\n'),'text/csv');toast('Testers exported');
}

/* ---------------- plumbing ---------------- */
function open_(){$('#panel').classList.add('open');$('#scrim').classList.add('open');document.body.style.overflow='hidden';}
function closeAll(){$('#panel').classList.remove('open');$('#scrim').classList.remove('open');
  $('#lightbox').classList.remove('open');document.body.style.overflow='';ui.openId=null;}
$('#scrim').onclick=closeAll;
$('#lightbox').onclick=()=>$('#lightbox').classList.remove('open');
$('#fabNew').onclick=openForm;
$$('#tabs .tab').forEach(t=>t.onclick=()=>go(t.dataset.view));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();});

/* ---------------- boot ---------------- */
(async function(){
  S=await Store.load();
  if(!S||!S.reports){S=seed();await Store.save(S);}
  S.testers=S.testers||{};S.updates=S.updates||[];
  S.profile.lastSeen=Date.now();
  if(S.profile.name||S.profile.email)syncTester();
  ui.view=(location.hash||'').replace('#','')||'reports';
  if(!$('#view-'+ui.view)||(ui.view==='admin'&&!isAdmin()))ui.view='reports';
  refresh();
  if(!S.profile.name)setTimeout(()=>toast('Add your name and serial under “You” first'),700);
})();

/* ==================================================================
   FIREBASE — what to change when you wire it up

   Only Store.load and Store.save touch persistence. To go live:

   1. Auth: Firebase email-link or Google sign-in. Replace
      S.profile.id with the Firebase uid, and take name and email
      from the auth user instead of the form.

   2. Data: one Firestore document per report in a `reports`
      collection, not one big blob — otherwise two testers saving at
      the same second overwrite each other. Votes go in a
      subcollection `reports/{id}/votes/{uid}` for the same reason.
      Tester details live in `testers/{uid}`.

   3. Admin: S.profile.role must NOT come from the client. Use a
      custom claim, or an `admins/{uid}` document. The prompt-for-a-
      code switch above is fine for a demo and useless as security.

   4. Rules sketch:
        match /reports/{id} {
          allow read: if request.auth != null;
          allow create: if request.auth.uid == request.resource.data.reporter.id;
          allow update: if request.auth.uid == resource.data.reporter.id
                        || exists(/databases/$(database)/documents/admins/$(request.auth.uid));
        }
        match /testers/{uid} {
          allow read: if exists(/databases/$(database)/documents/admins/$(request.auth.uid));
          allow write: if request.auth.uid == uid;
        }
      Note testers/{uid} is admin-read only — testers should not be
      able to list each other's emails and serials.

   5. Photos go to Firebase Storage, not Firestore. Base64 in a
      document hits the 1 MB limit fast.
   ================================================================== */
</script>
