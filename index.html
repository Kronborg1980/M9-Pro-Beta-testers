<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anthbot M9 Pro — Beta Tester Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   ANTHBOT M9 PRO — HARDWARE PALETTE & DESIGN SYSTEM
   ========================================================== */
:root {
  --bg: #F2F4F7;
  --card: #FFFFFF;
  --surface: #E8ECEF;
  --surface-2: #DCE2E8;
  --ink: #1C2127;
  --body: #363F49;
  --muted: #64707D;
  --line: #DCE2E8;
  --line-strong: #C2CBD4;

  /* M9 Pro Hardware Accents */
  --stop: #D9342A;
  --stop-hover: #B8251C;
  --stop-tint: #FDECEB;
  --violet: #6B53A6;
  --violet-hover: #553F8A;
  --violet-tint: #EFEBF9;
  --bronze: #9E7832;
  --bronze-tint: #FBF4E6;
  --ok: #1E7E48;
  --ok-tint: #E6F6EC;

  --radius-xl: 20px;
  --radius-l: 14px;
  --radius-m: 10px;
  --radius-s: 8px;
  --shadow: 0 12px 32px -12px rgba(28, 33, 39, 0.14);
  --shadow-sm: 0 2px 8px -2px rgba(28, 33, 39, 0.08);

  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

:root[data-theme="night"] {
  --bg: #111519;
  --card: #1A2026;
  --surface: #232B33;
  --surface-2: #2D3741;
  --ink: #F0F4F8;
  --body: #CBD5E0;
  --muted: #8B99A8;
  --line: #2B343D;
  --line-strong: #3D4956;

  --stop: #FF5C52;
  --stop-hover: #FF7870;
  --stop-tint: rgba(255, 92, 82, 0.15);
  --violet: #9D86E9;
  --violet-hover: #B4A1F0;
  --violet-tint: rgba(157, 134, 233, 0.16);
  --bronze: #DEB468;
  --bronze-tint: rgba(222, 180, 104, 0.15);
  --ok: #48C77E;
  --ok-tint: rgba(72, 199, 126, 0.15);

  --shadow: 0 14px 36px -12px rgba(0, 0, 0, 0.65);
  --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--body);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 90px;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-display); color: var(--ink); margin: 0; letter-spacing: -0.02em; }

/* ---------------- Top Header ---------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 12px 20px;
}
.topbar-inner {
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  cursor: pointer;
}
.mower-badge {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: linear-gradient(145deg, #FFFFFF, #CBD2D9 60%, #E8ECEF);
  border: 1px solid var(--line-strong);
  position: relative;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}
.mower-badge::after {
  content: "";
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 6px;
  border-radius: 3px;
  background: var(--stop);
}
.brand-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--ink); line-height: 1.1; }
.brand-sub { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bronze); display: block; margin-top: 2px; }

/* Desktop Nav */
.nav-tabs {
  display: flex;
  gap: 6px;
}
.tab-btn {
  background: transparent;
  border: 1px solid transparent;
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: 0.15s;
}
.tab-btn:hover { color: var(--ink); background: var(--surface); }
.tab-btn.active { background: var(--ink); color: var(--card); }
.tab-btn .badge {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--surface-2);
  color: var(--ink);
}
.tab-btn.active .badge { background: rgba(255,255,255,0.2); color: var(--card); }

.top-actions { display: flex; align-items: center; gap: 8px; }

/* ---------------- Buttons & Chips ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 99px;
  font-weight: 600;
  font-size: 14px;
  border: 1px solid var(--line-strong);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  transition: 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface); }
.btn-stop {
  background: var(--stop);
  border-color: var(--stop);
  color: #FFFFFF;
  box-shadow: 0 6px 16px -6px rgba(217, 52, 42, 0.65);
}
.btn-stop:hover { background: var(--stop-hover); border-color: var(--stop-hover); }
:root[data-theme="night"] .btn-stop { color: #180605; }
.btn-primary {
  background: var(--violet);
  border-color: var(--violet);
  color: #FFFFFF;
}
.btn-primary:hover { background: var(--violet-hover); }
:root[data-theme="night"] .btn-primary { color: #130D24; }
.btn-sm { padding: 6px 12px; font-size: 12.5px; }
.btn-xl { padding: 15px 26px; font-size: 16px; border-radius: 14px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}
.chip-stop { background: var(--stop-tint); color: var(--stop); }
.chip-violet { background: var(--violet-tint); color: var(--violet); }
.chip-bronze { background: var(--bronze-tint); color: var(--bronze); }
.chip-ok { background: var(--ok-tint); color: var(--ok); }
.chip-muted { background: var(--surface); color: var(--muted); }
.mono { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* ---------------- Layout ---------------- */
.container {
  max-width: 980px;
  margin: 0 auto;
  padding: 24px 20px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}

/* ---------------- Home Hero ---------------- */
.hero {
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-xl);
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 22px;
}
.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.hero h1 { font-size: clamp(24px, 3.5vw, 32px); line-height: 1.15; margin-top: 4px; }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 56ch; }
.quick-triggers {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  gap: 10px;
}
.q-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--radius-m);
  border: 1px solid var(--line);
  background: var(--bg);
  cursor: pointer;
  text-align: left;
  transition: 0.15s;
}
.q-card:hover {
  border-color: var(--violet);
  background: var(--violet-tint);
  transform: translateY(-2px);
}
.q-card .q-emo { font-size: 22px; line-height: 1; }
.q-card b { display: block; font-size: 14px; color: var(--ink); }
.q-card small { font-size: 12px; color: var(--muted); }

/* Notice Banner */
.notice-bar {
  background: var(--stop-tint);
  border: 1px solid var(--stop);
  border-radius: var(--radius-l);
  padding: 14px 18px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.notice-bar b { color: var(--stop); }

/* Stats strip */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 26px;
}
.stat-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 16px;
  cursor: pointer;
  text-align: left;
  transition: 0.15s;
}
.stat-box:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.stat-num { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--ink); line-height: 1; }
.stat-label { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* ---------------- Issue List & Cards ---------------- */
.filter-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.search-input {
  flex: 1;
  min-width: 210px;
  padding: 10px 16px;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--card);
}
.pill-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.pill {
  padding: 7px 14px;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--card);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.pill.active { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 600; }

.issue-list { display: flex; flex-direction: column; gap: 10px; }
.issue-row {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 16px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  align-items: center;
  cursor: pointer;
  transition: 0.15s;
}
.issue-row:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
.issue-row.critical-row { border-left: 4px solid var(--stop); }

.me-too-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 64px;
  height: 60px;
  border-radius: var(--radius-m);
  border: 1px solid var(--line-strong);
  background: var(--bg);
  cursor: pointer;
  transition: 0.15s;
  padding: 6px;
}
.me-too-btn:hover { border-color: var(--violet); background: var(--violet-tint); }
.me-too-btn.voted {
  background: var(--violet);
  border-color: var(--violet);
  color: #FFFFFF;
}
:root[data-theme="night"] .me-too-btn.voted { color: #130D24; }
.me-too-count { font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1; }
.me-too-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; opacity: 0.85; }

.issue-main h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
.issue-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---------------- Checklist ---------------- */
.check-group { margin-bottom: 24px; }
.check-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}
.check-item.pass { border-color: var(--ok); background: var(--ok-tint); }
.check-item.fail { border-color: var(--stop); background: var(--stop-tint); }
.check-actions { display: flex; gap: 6px; align-items: center; }

/* ---------------- Super-Easy Modal Form ---------------- */
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 20, 26, 0.6);
  backdrop-filter: blur(3px);
  z-index: 100;
  display: none;
  place-items: center;
  padding: 16px;
  overflow-y: auto;
}
.backdrop.open { display: grid; }
.modal {
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-xl);
  width: min(640px, 100%);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.modal-head {
  padding: 18px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-body {
  padding: 22px 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.modal-foot {
  padding: 16px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: var(--bg);
}
.close-btn {
  background: var(--surface);
  border: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: grid;
  place-items: center;
}

/* Tap Selector Grids inside Modal */
.field-label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
}
.field-label span { font-weight: 400; color: var(--muted); }
.tap-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
  gap: 8px;
}
.tap-tile {
  padding: 11px 12px;
  border-radius: var(--radius-m);
  border: 1px solid var(--line-strong);
  background: var(--bg);
  text-align: left;
  cursor: pointer;
  transition: 0.12s;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  font-weight: 600;
}
.tap-tile:hover { border-color: var(--violet); }
.tap-tile.selected {
  background: var(--violet-tint);
  border-color: var(--violet);
  color: var(--violet);
  box-shadow: inset 0 0 0 1px var(--violet);
}
.tap-tile.selected.sev-stop {
  background: var(--stop-tint);
  border-color: var(--stop);
  color: var(--stop);
  box-shadow: inset 0 0 0 1px var(--stop);
}

input[type="text"], input[type="email"], textarea, select {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-m);
  border: 1px solid var(--line-strong);
  background: var(--bg);
  color: var(--ink);
  font-size: 14.5px;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--violet);
  background: var(--card);
}
textarea { min-height: 92px; resize: vertical; }

/* Duplicate suggestion box */
.dup-box {
  background: var(--bronze-tint);
  border: 1px solid var(--bronze);
  border-radius: var(--radius-m);
  padding: 12px 14px;
  margin-top: 8px;
}
.dup-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(158, 120, 50, 0.2);
  font-size: 13.5px;
}
.dup-item:last-child { border-bottom: 0; padding-bottom: 0; }

/* Photo Upload */
.photo-drop {
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-m);
  padding: 14px;
  text-align: center;
  background: var(--bg);
  cursor: pointer;
}
.thumb-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.thumb {
  width: 76px;
  height: 76px;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--line-strong);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb button {
  position: absolute;
  top: 3px;
  right: 3px;
  background: rgba(0,0,0,0.75);
  color: #fff;
  border: 0;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 12px;
}

/* Mobile Bottom Bar */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--line-strong);
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  z-index: 60;
  justify-content: space-around;
}
.mobile-nav button {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
}
.mobile-nav button.active { color: var(--stop); }

/* Toast */
#toastBox {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: var(--card);
  padding: 12px 20px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow);
}

@media (max-width: 760px) {
  .nav-tabs { display: none; }
  .mobile-nav { display: flex; }
  .issue-row { grid-template-columns: auto 1fr; }
  .issue-right { grid-column: 2; }
}
</style>
</head>
<body>

<!-- TOP NAVIGATION BAR -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="goHomeLogo">
      <div class="mower-badge"></div>
      <div>
        <div class="brand-title">Anthbot M9 Pro</div>
        <span class="brand-sub">Beta Tester Hub</span>
      </div>
    </div>

    <nav class="nav-tabs" id="desktopNav"></nav>

    <div class="top-actions">
      <button class="btn btn-sm" id="themeBtn" title="Switch Day / Night">🌙</button>
      <button class="btn btn-stop" id="topReportBtn">+ Report Issue</button>
    </div>
  </div>
</header>

<!-- MAIN CONTENT AREA -->
<main class="container" id="appMain"></main>

<!-- MOBILE BOTTOM NAVIGATION -->
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- MODAL (NEW REPORT OR ISSUE DETAIL) -->
<div class="backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<!-- TOAST NOTIFICATIONS -->
<div id="toastBox"></div>

<script>
"use strict";

/* ==========================================================
   SIMPLE CATEGORIES & CONSTANTS
   ========================================================== */
const KINDS = [
  { id: 'bug',     emo: '🐛', label: 'Bug / Error',    chip: 'chip-stop' },
  { id: 'safety',  emo: '🛑', label: 'Safety Issue',   chip: 'chip-stop' },
  { id: 'stuck',   emo: '🛞', label: 'Got Stuck',      chip: 'chip-bronze' },
  { id: 'signal',  emo: '📡', label: 'Lost Signal',    chip: 'chip-bronze' },
  { id: 'cut',     emo: '🌱', label: 'Poor Cut',       chip: 'chip-violet' },
  { id: 'wish',    emo: '💡', label: 'Feature Wish',   chip: 'chip-violet' }
];

const PARTS = [
  'Mapping & Boundary',
  'GPS / RTK Signal',
  'Mowing & Navigation',
  'Docking & Charging',
  'Blades & Cutting Deck',
  'Obstacle Sensors',
  'Wheels & Slopes',
  'Mobile App & Wi-Fi',
  'Battery & Runtime',
  'Other / Not Sure'
];

const SEVERITIES = [
  { id: 'critical', emo: '🛑', label: 'Dangerous / Unusable', cls: 'sev-stop', chip: 'chip-stop' },
  { id: 'high',     emo: '⚠️', label: 'Major Problem',        cls: '',         chip: 'chip-bronze' },
  { id: 'medium',   emo: '🔧', label: 'Annoying',             cls: '',         chip: 'chip-violet' },
  { id: 'low',      emo: '💬', label: 'Minor / Cosmetic',     cls: '',         chip: 'chip-muted' }
];

const STATUSES = {
  'open':      { label: 'Open',               chip: 'chip-bronze' },
  'fixing':    { label: 'Anthbot Fixing',     chip: 'chip-violet' },
  'fixed':     { label: 'Fixed — Test It!',   chip: 'chip-ok' },
  'verified':  { label: 'Confirmed Fixed',    chip: 'chip-muted' }
};

const QUICK_CHECKS = [
  { id: 'c1', group: 'First Setup',    text: 'Paired and mapped the boundary on the first try' },
  { id: 'c2', group: 'First Setup',    text: 'RTK / GPS signal stays locked around trees and walls' },
  { id: 'c3', group: 'Mowing & Cut',   text: 'Finishes a full zone with no uncut stripes left behind' },
  { id: 'c4', group: 'Mowing & Cut',   text: 'Climbs your steepest slope without wheel slip' },
  { id: 'c5', group: 'Safety',         text: 'Stops cleanly for an object left on the grass' },

/* ==========================================================
   HELPERS
   ========================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ago(ts) {
  const sec = (Date.now() - ts) / 1000;
  if (sec < 60) return 'just now';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
  return Math.floor(sec / 86400) + 'd ago';
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = '✓ ' + msg;
  $('#toastBox').appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function applyTheme() {
  const theme = S.profile.theme || 'day';
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeBtn').textContent = theme === 'night' ? '☀️' : '🌙';
}

/* Shrink image so localStorage never overflows */
function compressPhoto(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1000;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

      <div class="modal-body">
        <!-- 1. What happened -->
        <div>
          <label class="field-label">1. What kind of issue is it?</label>
          <div class="tap-grid">
            ${KINDS.map(k => `
              <button type="button" class="tap-tile ${draft.kind === k.id ? 'selected' : ''}" data-k="${k.id}">
                <span>${k.emo}</span> <span>${esc(k.label)}</span>
              </button>
            `).join('')}
          </div>
        </div>

        <!-- 2. Short summary + instant duplicate detector -->
        <div>
          <label class="field-label">2. In one line, what happened?</label>
          <input type="text" id="repTitle" placeholder="${isWish ? 'e.g. Add a rain delay button on the home screen' : 'e.g. Mower stops in wet grass with error E-217'}" value="${esc(draft.title)}">
          <div id="dupMatches"></div>
        </div>

        <!-- 3. Which part -->
        <div>
          <label class="field-label">3. Area of the mower</label>
          <select id="repPart">
            ${PARTS.map(p => `<option ${draft.part === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}
          </select>
        </div>

        <!-- 4. How bad (hidden for wishes) -->
        ${!isWish ? `
          <div>
            <label class="field-label">4. How bad is it?</label>
            <div class="tap-grid">
              ${SEVERITIES.map(s => `
                <button type="button" class="tap-tile ${s.cls} ${draft.severity === s.id ? 'selected' : ''}" data-s="${s.id}">
                  <span>${s.emo}</span> <span>${esc(s.label)}</span>
                </button>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- 5. Extra notes & photos -->
        <div>
          <label class="field-label">Details or steps <span>(Optional)</span></label>
          <textarea id="repNotes" placeholder="Where on the lawn, weather conditions, or how to make it happen again...">${esc(draft.notes)}</textarea>
        </div>

        <div>
          <label class="field-label">Photos <span>(Optional — auto-compressed)</span></label>
          <label class="photo-drop">
            <input type="file" id="repPhotos" accept="image/*" multiple hidden>
            📷 Tap to add photos of the mower or app screen
          </label>
          <div class="thumb-row" id="photoThumbs">
            ${draft.photos.map((src, idx) => `
              <div class="thumb">
                <img src="${src}" alt="attachment">
                <button type="button" data-rm-photo="${idx}">×</button>
              </div>
            `).join('')}
          </div>
        </div>

        ${!S.profile.name ? `
          <div>
            <label class="field-label">Your Name <span>(Saved for next time)</span></label>
            <input type="text" id="repUserName" placeholder="e.g. Lasse K.">
          </div>
        ` : ''}
      </div>

      <div class="modal-foot">
        <span class="mono">Firmware ${esc(S.profile.firmware || '2.4.1')}</span>
        <div style="display:flex;gap:8px">
          <button class="btn" id="cancelModal">Cancel</button>
          <button class="btn btn-stop" id="submitReportBtn">Send Report</button>
        </div>
      </div>
    `;

    $('#closeModal').onclick = closeModal;
    $('#cancelModal').onclick = closeModal;

    const syncInputs = () => {
      draft.title = $('#repTitle').value;
      draft.part = $('#repPart').value;
      draft.notes = $('#repNotes').value;
    };

    $$('[data-k]', box).forEach(b => b.onclick = () => { syncInputs(); draft.kind = b.dataset.k; paint(); });      $$
('[data-s]', box).forEach(b => b.onclick = () => {
      syncInputs();
      draft.severity = b.dataset.s;
      paint();
    });

    // Live duplicate detector
    $('#repTitle').oninput = e => {
      draft.title = e.target.value;
      const words = draft.title.toLowerCase().split(/\s+/).filter(w => w.length > 3);
      if (words.length === 0) {
        $('#dupMatches').innerHTML = '';
        return;
      }
      const matches = S.issues.filter(i => words.some(w => (i.title + ' ' + i.notes).toLowerCase().includes(w))).slice(0, 2);
      if (!matches.length) {
        $('#dupMatches').innerHTML = '';
        return;
      }
      $('#dupMatches').innerHTML = `
        <div class="dup-box">
          <div style="font-size:12px;font-weight:700;color:var(--bronze);margin-bottom:4px">💡 Already reported? Tap "+1 Same Here" instead:</div>
          ${matches.map(m => `
            <div class="dup-item">
              <span><b>${esc(m.key)}</b>:${esc(m.title)}</span>
              <button type="button" class="btn btn-sm btn-primary" data-dup-vote="${m.id}">+1 Same Here (${m.votes.length})</button>
            </div>
          `).join('')}
        </div>
      `;
      $$('[data-dup-vote]', box).forEach(btn => {
        btn.onclick = () => {
          toggleVote(btn.dataset.dupVote);
          closeModal();
        };
      });
    };

    // Photo handling
    $('#repPhotos').onchange = async e => { syncInputs(); for (const file of [...e.target.files].slice(0, 4)) { const dataUrl = await compressPhoto(file); draft.photos.push(dataUrl); } paint(); }; $$('[data-rm-photo]', box).forEach(btn => {
      btn.onclick = () => {
        syncInputs();
        draft.photos.splice(Number(btn.dataset.rmPhoto), 1);
        paint();
      };
    });

    // Submit report
    $('#submitReportBtn').onclick = () => {
      syncInputs();
      if (!draft.title.trim()) {
        $('#repTitle').focus();
        toast('Please enter a short one-line summary');
        return;
      }
      if (!S.profile.name && $('#repUserName')) {
        S.profile.name = $('#repUserName').value.trim();
      }
      S.counter++;
      const newIssue = {
        id: 'i_' + Date.now(),
        key: 'M9-' + String(S.counter).padStart(3, '0'),
        title: draft.title.trim(),
        kind: draft.kind,
        part: draft.part,
        severity: draft.kind === 'wish' ? 'low' : draft.severity,
        status: 'open',
        notes: draft.notes.trim(),
        reply: '',
        reporter: S.profile.name || 'Tester',
        serial: S.profile.serial || '—',
        firmware: S.profile.firmware || '2.4.1',
        votes: [S.profile.id],
        photos: draft.photos,
        comments: [],
        createdAt: Date.now()
      };
      S.issues.unshift(newIssue);
      saveState();
      closeModal();
      renderApp();
      toast(`Submitted ${newIssue.key} — thank you!`);
    };
  }

  paint();
  $('#modalBackdrop').classList.add('open');
}

/* ==========================================================
   ISSUE DETAIL & COMMENTS MODAL
   ========================================================== */
function openDetailModal(id) {
  const item = S.issues.find(x => x.id === id);
  if (!item) return;

  const k = KINDS.find(x => x.id === item.kind) || KINDS[0];
  const sev = SEVERITIES.find(x => x.id === item.severity) || SEVERITIES[2];
  const st = STATUSES[item.status] || STATUSES.open;
  const voted = item.votes.includes(S.profile.id);
  const isAdmin = S.profile.role === 'admin';

  const box = $('#modalBox');
  box.innerHTML = `
    <div class="modal-head">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="mono">${esc(item.key)}</span>
        <span class="chip ${k.chip}">${k.emo} ${esc(k.label)}</span>
        <span class="chip ${st.chip}">${esc(st.label)}</span>
      </div>
      <button class="close-btn" id="closeModal">×</button>
    </div>

    <div class="modal-body">
      <h2 style="font-size:21px;line-height:1.25">${esc(item.title)}</h2>

      <div class="mono">
        Reported by <b>${esc(item.reporter)}</b> · Part: <b>${esc(item.part)}</b> · Firmware ${esc(item.firmware)} · ${ago(item.createdAt)}
      </div>

      ${item.reply ? `
        <div style="background:var(--violet-tint);border-left:4px solid var(--violet);padding:14px;border-radius:8px">
          <div style="font-size:12px;font-weight:700;color:var(--violet);text-transform:uppercase">Official Anthbot Response</div>
          <div style="margin-top:4px">${esc(item.reply)}</div>
        </div>
      ` : ''}

      ${item.notes ? `
        <div style="background:var(--bg);padding:14px;border-radius:10px;white-space:pre-wrap">${esc(item.notes)}</div>
      ` : ''}

      ${item.photos && item.photos.length ? `
        <div class="thumb-row">
          ${item.photos.map(src => `<a href="${src}" target="_blank" class="thumb"><img src="${src}"></a>`).join('')}
        </div>
      ` : ''}

      ${item.status === 'fixed' ? `
        <div style="background:var(--ok-tint);border:1px solid var(--ok);padding:14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <div><b>Anthbot marked this fixed!</b> Did it work on your mower?</div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-sm btn-primary" id="verifyOkBtn">✓ Yes, Fixed</button>
            <button class="btn btn-sm btn-stop" id="verifyFailBtn">✕ Still Broken</button>
          </div>
        </div>
      ` : ''}

      ${isAdmin ? `
        <div style="border:1px dashed var(--violet);padding:14px;border-radius:10px;background:var(--bg)">
          <div class="field-label" style="color:var(--violet)">Staff Controls</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
            <div>
              <label class="field-label">Status</label>
              <select id="admStatus">
                ${Object.entries(STATUSES).map(([k, v]) => `<option value="${k}" ${item.status === k ? 'selected' : ''}>${v.label}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="field-label">Severity</label>
              <select id="admSev">
                ${SEVERITIES.map(s => `<option value="${s.id}" ${item.severity === s.id ? 'selected' : ''}>${s.label}</option>`).join('')}
              </select>
            </div>
          </div>
          <label class="field-label">Official Answer</label>
          <textarea id="admReply" style="min-height:60px">${esc(item.reply || '')}</textarea>
          <div style="display:flex;justify-content:space-between;margin-top:10px">
            <button class="btn btn-sm btn-primary" id="admSaveBtn">Save Staff Update</button>
            <button class="btn btn-sm" id="admDeleteBtn" style="color:var(--stop)">Delete Report</button>
          </div>
        </div>
      ` : ''}

      <!-- Comments -->
      <div style="border-top:1px solid var(--line);padding-top:14px">
        <label class="field-label">Tester Comments (${item.comments.length})</label>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
          ${item.comments.map(c => `
            <div style="background:var(--bg);padding:10px 12px;border-radius:8px;font-size:13.5px">
              <b>${esc(c.by)}</b> <span class="mono">· ${ago(c.at)}</span>
              <div style="margin-top:3px">${esc(c.text)}</div>
            </div>
          `).join('') || '<div class="mono">No comments yet. Add your experience or workaround below.</div>'}
        </div>
        <div style="display:flex;gap:8px">
          <input type="text" id="newCommentInput" placeholder="Write a quick comment...">
          <button class="btn btn-sm btn-primary" id="postCommentBtn">Post</button>
        </div>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn ${voted ? 'btn-primary' : ''}" id="modalVoteBtn">
        ${voted ? '✓ Happens to Me Too' : '+1 Happens to Me Too'} (${item.votes.length})
      </button>
      <button class="btn" id="closeModalFoot">Close</button>
    </div>
  `;

  $('#closeModal').onclick = closeModal;
  $('#closeModalFoot').onclick = closeModal;

  $('#modalVoteBtn').onclick = () => {
    toggleVote(item.id);
    openDetailModal(item.id);
  };

  if ($('#verifyOkBtn')) {
    $('#verifyOkBtn').onclick = () => {
      item.status = 'verified';
      saveState();
      toast('Marked as Confirmed Fixed!');
      openDetailModal(item.id);
      renderApp();
    };
    $('#verifyFailBtn').onclick = () => {
      item.status = 'open';
      item.comments.push({ by: S.profile.name || 'Tester', text: 'Tested the fix — still happening on my mower.', at: Date.now() });
      saveState();
      toast('Re-opened issue');
      openDetailModal(item.id);
      renderApp();
    };
  }

  if (isAdmin) {
    $('#admSaveBtn').onclick = () => {
      item.status = $('#admStatus').value;
      item.severity = $('#admSev').value;
      item.reply = $('#admReply').value.trim();
      saveState();
      toast('Updated ' + item.key);
      openDetailModal(item.id);
      renderApp();
    };
    $('#admDeleteBtn').onclick = () => {
      if (!confirm(`Delete ${item.key}?`)) return;
      S.issues = S.issues.filter(x => x.id !== item.id);
      saveState();
      closeModal();
      renderApp();
      toast('Deleted report');
    };
  }

  const addComment = () => {
    const txt = $('#newCommentInput').value.trim();
    if (!txt) return;
    item.comments.push({
      by: S.profile.name || (isAdmin ? 'Anthbot Staff' : 'Tester'),
      text: txt,
      at: Date.now()
    });
    saveState();
    openDetailModal(item.id);
    renderApp();
  };
  $('#postCommentBtn').onclick = addComment;
  $('#newCommentInput').onkeydown = e => { if (e.key === 'Enter') addComment(); };

  $('#modalBackdrop').classList.add('open');
}

function closeModal() {
  $('#modalBackdrop').classList.remove('open');
}

/* ==========================================================
   CSV EXPORT
   ========================================================== */
function exportCSV() {
  const headers = ['ID', 'Title', 'Kind', 'Area', 'Severity', 'Status', 'Votes', 'Reporter', 'Serial', 'Firmware', 'Notes', 'Anthbot Reply'];
  const escCSV = val => `"${String(val ?? '').replace(/"/g, '""')}"`;
  const rows = S.issues.map(i => [
    i.key, i.title, i.kind, i.part, i.severity, i.status, i.votes.length,
    i.reporter, i.serial, i.firmware, i.notes, i.reply
  ].map(escCSV).join(','));

  const blob = new Blob([headers.join(',') + '\n' + rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `anthbot-m9-issues-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('CSV downloaded');
}

/* ==========================================================
   GLOBAL EVENTS & BOOT
   ========================================================== */
$('#topReportBtn').onclick = () => openReportModal();
$('#goHomeLogo').onclick = () => { UI.tab = 'home'; renderApp(); };
$('#themeBtn').onclick = () => {
  S.profile.theme = S.profile.theme === 'night' ? 'day' : 'night';
  saveState();
  applyTheme();
};
$('#modalBackdrop').onclick = e => {
  if (e.target === $('#modalBackdrop')) closeModal();
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

renderApp();
</script>
</body>
</html>
