<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANTHBOT M9 Pro — Pioneer Beta Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   ANTHBOT OFFICIAL BRAND PALETTE (eu.anthbot.com)
   Fresh Lawn Green, Deep Forest Charcoal, Crisp Alabaster
   ========================================================== */
:root {
  --bg: #F5F8F6;
  --bg-subtle: #EBF2EE;
  --card: #FFFFFF;
  --card-hover: #FCFDFC;
  --ink: #0B1911;
  --body: #2C3E34;
  --muted: #607569;
  --line: #E0EAE4;
  --line-strong: #C6D8CD;

  /* Official Anthbot Greens & Accents */
  --brand: #12B855;
  --brand-dark: #0C9443;
  --brand-deep: #092214;
  --brand-tint: #E6F9EE;
  --brand-glow: rgba(18, 184, 85, 0.22);

  --lime: #A3E635;
  --amber: #F59E0B;
  --amber-tint: #FEF5E6;
  --danger: #EF4444;
  --danger-tint: #FEECEC;
  --info: #0EA5E9;
  --info-tint: #E6F6FE;

  --radius-2xl: 24px;
  --radius-xl: 18px;
  --radius-l: 14px;
  --radius-m: 10px;
  --shadow-sm: 0 2px 10px rgba(11, 25, 17, 0.04);
  --shadow-md: 0 12px 30px -8px rgba(11, 25, 17, 0.08);
  --shadow-lg: 0 22px 48px -12px rgba(11, 25, 17, 0.14);

  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

:root[data-theme="dark"] {
  --bg: #08120C;
  --bg-subtle: #112118;
  --card: #0F1D15;
  --card-hover: #15271D;
  --ink: #F2F9F5;
  --body: #C5D6CC;
  --muted: #7F998A;
  --line: #1C3125;
  --line-strong: #2A4736;

  --brand: #1ED760;
  --brand-dark: #15B858;
  --brand-deep: #06150C;
  --brand-tint: rgba(30, 215, 96, 0.14);
  --brand-glow: rgba(30, 215, 96, 0.25);

  --amber: #FBBF24;
  --amber-tint: rgba(251, 191, 36, 0.14);
  --danger: #F87171;
  --danger-tint: rgba(248, 113, 113, 0.14);
  --info: #38BDF8;
  --info-tint: rgba(56, 189, 248, 0.14);

  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 12px 30px -8px rgba(0, 0, 0, 0.55);
  --shadow-lg: 0 24px 52px -12px rgba(0, 0, 0, 0.75);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--body);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 96px;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { color: var(--ink); margin: 0; letter-spacing: -0.025em; }

/* ---------------- Top Promo/Beta Bar ---------------- */
.announcement {
  background: var(--brand-deep);
  color: #E2F5EA;
  font-size: 12.5px;
  font-weight: 500;
  padding: 9px 16px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.announcement .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 0 4px rgba(18, 184, 85, 0.25);
}
.announcement b { color: #FFFFFF; font-weight: 700; }

/* ---------------- Header ---------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
}
:root[data-theme="dark"] .topbar {
  background: rgba(15, 29, 21, 0.86);
}
.topbar-inner {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}
.brand-mark {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  display: grid;
  place-items: center;
  color: #FFFFFF;
  font-weight: 800;
  font-size: 19px;
  letter-spacing: -0.04em;
  box-shadow: 0 6px 16px var(--brand-glow);
}
.brand-name {
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.04em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 7px;
}
.brand-pill {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--brand-tint);
  color: var(--brand-dark);
  padding: 2px 8px;
  border-radius: 99px;
}
:root[data-theme="dark"] .brand-pill { color: var(--brand); }
.brand-sub {
  font-size: 11.5px;
  color: var(--muted);
  display: block;
  margin-top: 1px;
}

/* Navigation Pills */
.nav-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-subtle);
  padding: 4px;
  border-radius: 99px;
  border: 1px solid var(--line);
}
.tab-btn {
  background: transparent;
  border: 0;
  padding: 8px 16px;
  border-radius: 99px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all 0.18s ease;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active {
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.tab-btn .badge {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--brand-tint);
  color: var(--brand-dark);
  font-weight: 700;
}
:root[data-theme="dark"] .tab-btn .badge { color: var(--brand); }

.top-actions { display: flex; align-items: center; gap: 10px; }

/* ---------------- Buttons & Badges ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 99px;
  font-weight: 700;
  font-size: 14px;
  border: 1px solid var(--line-strong);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.16s ease;
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--brand);
  transform: translateY(-1px);
}
.btn-brand {
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  border-color: transparent;
  color: #FFFFFF;
  box-shadow: 0 8px 20px -4px var(--brand-glow);
}
.btn-brand:hover {
  filter: brightness(1.05);
  box-shadow: 0 12px 24px -4px var(--brand-glow);
}
:root[data-theme="dark"] .btn-brand { color: #05140B; }

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--muted);
}
.btn-ghost:hover { background: var(--bg-subtle); color: var(--ink); border-color: transparent; }
.btn-sm { padding: 7px 13px; font-size: 12.5px; }
.btn-xl { padding: 15px 28px; font-size: 15.5px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 700;
  white-space: nowrap;
}
.chip-brand  { background: var(--brand-tint); color: var(--brand-dark); }
:root[data-theme="dark"] .chip-brand { color: var(--brand); }
.chip-amber  { background: var(--amber-tint); color: #B45309; }
:root[data-theme="dark"] .chip-amber { color: var(--amber); }
.chip-danger { background: var(--danger-tint); color: #DC2626; }
:root[data-theme="dark"] .chip-danger { color: var(--danger); }
.chip-info   { background: var(--info-tint); color: #0284C7; }
:root[data-theme="dark"] .chip-info { color: var(--info); }
.chip-muted  { background: var(--bg-subtle); color: var(--muted); font-weight: 600; }

.mono { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* ---------------- Layout ---------------- */
.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 24px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 22px;
  box-shadow: var(--shadow-sm);
}

/* ---------------- Anthbot Hero Showcase ---------------- */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-2xl);
  background: radial-gradient(120% 130% at 95% 10%, #165934 0%, #0B2918 55%, #07190F 100%);
  color: #FFFFFF;
  padding: 36px;
  box-shadow: var(--shadow-lg);
  margin-bottom: 24px;
  border: 1px solid rgba(255,255,255,0.08);
}
.hero::before {
  content: "";
  position: absolute;
  width: 420px;
  height: 420px;
  right: -120px;
  top: -140px;
  background: radial-gradient(circle, rgba(18, 184, 85, 0.32), transparent 68%);
  pointer-events: none;
}
.hero-top {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border-radius: 99px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  font-size: 12px;
  font-weight: 600;
  color: #A7F3D0;
  margin-bottom: 14px;
}
.hero h1 {
  color: #FFFFFF;
  font-size: clamp(26px, 3.8vw, 38px);
  font-weight: 800;
  line-height: 1.12;
  max-width: 18ch;
}
.hero h1 span { color: #34D399; }
.hero p {
  color: rgba(240, 253, 244, 0.8);
  margin: 10px 0 0;
  max-width: 56ch;
  font-size: 15px;
}
.hero-specs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}
.spec-pill {
  font-size: 11.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.08);
  color: #D1FAE5;
}

/* 6 Quick Report Cards inside Hero */
.quick-label {
  position: relative;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #A7F3D0;
  margin: 26px 0 10px;
}
.quick-grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 10px;
}
.q-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: var(--radius-l);
  padding: 14px;
  text-align: left;
  color: #FFFFFF;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 11px;
  transition: all 0.16s ease;
}
.q-card:hover {
  background: rgba(18, 184, 85, 0.24);
  border-color: #34D399;
  transform: translateY(-2px);
}
.q-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.12);
  display: grid;
  place-items: center;
  font-size: 19px;
  flex-shrink: 0;
}
.q-card b { display: block; font-size: 13.5px; line-height: 1.2; }
.q-card small { font-size: 11.5px; color: rgba(255,255,255,0.68); display: block; margin-top: 2px; }

/* ---------------- Stats Strip ---------------- */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 18px 20px;
  text-align: left;
  cursor: pointer;
  transition: all 0.16s ease;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stat-card:hover {
  border-color: var(--brand);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.stat-num {
  font-size: 30px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1;
}
.stat-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 6px;
}
.stat-ico {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--brand-tint);
  color: var(--brand-dark);
  display: grid;
  place-items: center;
  font-size: 20px;
}

/* ---------------- Issue List & Cards ---------------- */
.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.search-wrap {
  flex: 1;
  min-width: 240px;
  position: relative;
}
.search-input {
  width: 100%;
  padding: 12px 18px;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--card);
  font-size: 14.5px;
  transition: 0.15s;
}
.search-input:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-glow);
}
.pill-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.filter-pill {
  padding: 8px 16px;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--card);
  color: var(--body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.15s;
}
.filter-pill:hover { border-color: var(--brand); }
.filter-pill.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #FFFFFF;
}
:root[data-theme="dark"] .filter-pill.active { color: #05140B; }

.issue-list { display: flex; flex-direction: column; gap: 12px; }
.issue-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 16px 20px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  cursor: pointer;
  transition: all 0.16s ease;
  box-shadow: var(--shadow-sm);
}
.issue-card:hover {
  border-color: var(--brand);
  background: var(--card-hover);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

/* +1 Me Too Button */
.vote-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 66px;
  height: 64px;
  border-radius: var(--radius-l);
  border: 1.5px solid var(--line-strong);
  background: var(--bg);
  cursor: pointer;
  transition: all 0.15s ease;
}
.vote-box:hover {
  border-color: var(--brand);
  background: var(--brand-tint);
}
.vote-box.voted {
  background: var(--brand);
  border-color: var(--brand);
  color: #FFFFFF;
  box-shadow: 0 6px 14px var(--brand-glow);
}
:root[data-theme="dark"] .vote-box.voted { color: #05140B; }
.vote-num { font-size: 18px; font-weight: 800; line-height: 1; }
.vote-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }

.issue-body h3 {
  font-size: 16.5px;
  font-weight: 700;
  margin-bottom: 8px;
  line-height: 1.3;
}
.issue-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
}

/* ---------------- Checklist ---------------- */
.check-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 16px 18px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  transition: 0.15s;
}
.check-card.pass {
  border-color: var(--brand);
  background: var(--brand-tint);
}
.check-card.fail {
  border-color: var(--danger);
  background: var(--danger-tint);
}

/* ---------------- Modal (1-Screen Report Form & Details) ---------------- */
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(6, 16, 10, 0.65);
  backdrop-filter: blur(5px);
  z-index: 100;
  display: none;
  place-items: center;
  padding: 16px;
  overflow-y: auto;
}
.backdrop.open { display: grid; }
.modal {
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-2xl);
  width: min(660px, 100%);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: modalIn 0.2s ease-out;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
}
.modal-head {
  padding: 20px 26px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
}
.modal-body {
  padding: 24px 26px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.modal-foot {
  padding: 16px 26px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: var(--bg);
}
.close-x {
  background: var(--bg-subtle);
  border: 0;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.close-x:hover { background: var(--line-strong); }

/* Form Elements */
.field-label {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
}
.field-label span { font-weight: 500; color: var(--muted); }
.tap-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
}
.tap-tile {
  padding: 12px 13px;
  border-radius: var(--radius-m);
  border: 1.5px solid var(--line-strong);
  background: var(--bg);
  text-align: left;
  cursor: pointer;
  transition: 0.14s;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}
.tap-tile:hover { border-color: var(--brand); }
.tap-tile.selected {
  background: var(--brand-tint);
  border-color: var(--brand);
  color: var(--brand-dark);
}
:root[data-theme="dark"] .tap-tile.selected { color: var(--brand); }

input[type="text"], input[type="email"], textarea, select {
  width: 100%;
  padding: 12px 15px;
  border-radius: var(--radius-m);
  border: 1.5px solid var(--line-strong);
  background: var(--bg);
  color: var(--ink);
  font-size: 14.5px;
  transition: 0.15s;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--brand);
  background: var(--card);
  box-shadow: 0 0 0 3px var(--brand-glow);
}
textarea { min-height: 92px; resize: vertical; }

.dup-box {
  background: var(--amber-tint);
  border: 1px solid var(--amber);
  border-radius: var(--radius-m);
  padding: 12px 14px;
  margin-top: 8px;
}
.dup-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(245, 158, 11, 0.2);
  font-size: 13.5px;
}
.dup-row:last-child { border-bottom: 0; padding-bottom: 0; }

.photo-drop {
  display: block;
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--radius-l);
  padding: 16px;
  text-align: center;
  background: var(--bg);
  cursor: pointer;
  font-weight: 600;
  color: var(--muted);
  transition: 0.15s;
}
.photo-drop:hover { border-color: var(--brand); color: var(--brand-dark); background: var(--brand-tint); }
.thumb-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.thumb {
  width: 78px;
  height: 78px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--line-strong);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb button {
  position: absolute;
  top: 4px;
  right: 4px;
  background: rgba(0,0,0,0.75);
  color: #fff;
  border: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  cursor: pointer;
}

/* Mobile Bottom Nav */
.mobile-nav {
  display: none;
  position: fixed;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ago(ts) {
  const sec = (Date.now() - ts) / 1000;
  if (sec < 60) return 'just now';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
  return Math.floor(sec / 86400) + 'd ago';
}

function toast(msg) {
  const t = document.createElement('div');

}

function compressPhoto(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1000;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function toggleVote(id) {
  const item = S.issues.find(x => x.id === id);

  if (idx >= 0) {

  } else {
    item.votes.push(S.profile.id);

      </div>
      <button class="btn btn-sm" id="resetChecksBtn">Reset Progress</button>
    </div>

    ${groups.map(g => `
      <div style="margin-bottom:24px">
        <h3 style="margin-bottom:10px;color:var(--brand-dark)">${esc(g)}</h3>${M9_CHECKLIST.filter(c => c.group === g).map(c => {
          const st = S.checks[c.id] || '';
          return `
            <div class="check-card ${st}">
              <span style="font-weight:600">${esc(c.text)}</span>
              <div style="display:flex;gap:8px">
                <button class="btn btn-sm ${st === 'pass' ? 'btn-brand' : ''}" data-cid="${c.id}" data-val="pass">✓ Works Great</button>
                <button class="btn btn-sm" style="${st === 'fail' ? 'background:var(--danger);color:#fff;border-color:var(--danger)' : ''}" data-cid="${c.id}" data-val="fail" data-text="${esc(c.text)}">✕ Issue Found</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `).join('')}
  `;

  $$('[data-cid]', el).forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.cid;
      const val = btn.dataset.val;
      S.checks[id] = S.checks[id] === val ? '' : val;
      saveState();
      renderChecklist(el);
      renderNav();
      if (S.checks[id] === 'fail') {
        openReportModal({
          kind: 'bug',
          title: `Field test issue: ${btn.dataset.text}`
        });
      }
    };
  });

  $('#resetChecksBtn').onclick = () => {
    S.checks = {};
    saveState();
    renderChecklist(el);
    renderNav();
  };
}

/* ==========================================================
   SUPER-EASY 1-SCREEN REPORT MODAL
   ========================================================== */
function openReportModal(prefill = {}) {
  const draft = {
    kind: prefill.kind || 'bug',
    part: prefill.part || M9_SYSTEMS[0],
    severity: prefill.severity || 'high',
    title: prefill.title || '',
    notes: prefill.notes || '',
    photos: []
  };

  const box = $('#modalBox');

  function paint() {
    const isWish = draft.kind === 'wish';
    box.innerHTML = `
      <div class="modal-head">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="brand-mark" style="width:30px;height:30px;font-size:14px;border-radius:9px">A</div>
          <h3>Report to ANTHBOT Engineering</h3>
        </div>
        <button class="close-x" id="closeModal">×</button>
      </div>

      <div class="modal-body">
        <!-- 1. Category -->
        <div>
          <label class="field-label">1. What is this about?</label>
          <div class="tap-grid">
            ${KINDS.map(k => `
              <button type="button" class="tap-tile ${draft.kind === k.id ? 'selected' : ''}" data-k="${k.id}">
                <span>${k.emo}</span> <span>${esc(k.label)}</span>
              </button>
            `).join('')}
          </div>
        </div>

        <!-- 2. Summary + Live Duplicate Detector -->
        <div>
          <label class="field-label">2. Short one-line summary</label>
          <input type="text" id="repTitle" placeholder="${isWish ? 'e.g. Set different blade height for each zone' : 'e.g. Stops near wet flower bed border with E-217'}" value="${esc(draft.title)}">
          <div id="dupMatches"></div>
        </div>

        <!-- 3. M9 Pro System -->
        <div>
          <label class="field-label">3. M9 Pro System</label>
          <select id="repPart">
            ${M9_SYSTEMS.map(p => `<option ${draft.part === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}
          </select>
        </div>

        <!-- 4. Severity -->
        ${!isWish ? `
          <div>
            <label class="field-label">4. How severe is it?</label>
            <div class="tap-grid">
              ${SEVERITIES.map(s => `
                <button type="button" class="tap-tile ${draft.severity === s.id ? 'selected' : ''}" data-s="${s.id}">
                  <span>${s.emo}</span> <span>${esc(s.label)}</span>
                </button>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- 5. Notes & Photos -->
        <div>
          <label class="field-label">Extra details <span>(Optional — lawn conditions, steps, error code)</span></label>
          <textarea id="repNotes" placeholder="Tell us what the mower was doing...">${esc(draft.notes)}</textarea>
        </div>

        <div>
          <label class="field-label">Photos <span>(Optional — auto-shrunk)</span></label>
          <label class="photo-drop">
            <input type="file" id="repPhotos" accept="image/*" multiple hidden>
            📷 Tap to attach photos of your M9 Pro or App screen
          </label>
          <div class="thumb-row">
            ${draft.photos.map((src, idx) => `
              <div class="thumb">
                <img src="${src}" alt="photo">
                <button type="button" data-rm-photo="${idx}">×</button>
              </div>
            `).join('')}
          </div>
        </div>

        ${!S.profile.name ? `
          <div>
            <label class="field-label">Your Name <span>(Saved for future reports)</span></label>
            <input type="text" id="repUserName" placeholder="e.g. Lasse K.">
          </div>
        ` : ''}
      </div>

      <div class="modal-foot">
        <span class="mono">M9 Pro FW ${esc(S.profile.firmware || '2.4.1')}</span>
        <div style="display:flex;gap:8px">
          <button class="btn" id="cancelModal">Cancel</button>
          <button class="btn btn-brand" id="submitReportBtn">Send Report</button>
        </div>
      </div>
    `;

    $('#closeModal').onclick = closeModal;
    $('#cancelModal').onclick = closeModal;

    const sync = () => {
      draft.title = $('#repTitle').value;
      draft.part = $('#repPart').value;
      draft.notes = $('#repNotes').value;
    };

    $$('[data-k]', box).forEach(b => b.onclick = () => { sync(); draft.kind = b.dataset.k; paint(); });$$
('[data-s]', box).forEach(b => b.onclick = () => { sync(); draft.severity = b.dataset.s; paint(); });

    // Live Duplicate Catcher
    $('#repTitle').oninput = e => {
      draft.title = e.target.value;
      const words = draft.title.toLowerCase().split(/\s+/).filter(w => w.length > 3);
      if (!words.length) { $('#dupMatches').innerHTML = ''; return; }
      const matches = S.issues.filter(i => words.some(w => (i.title + ' ' + i.notes).toLowerCase().includes(w))).slice(0, 2);
      if (!matches.length) { $('#dupMatches').innerHTML = ''; return; }
      $('#dupMatches').innerHTML = `
        <div class="dup-box">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px">💡 Similar report already exists — tap "+1 Me Too" instead:</div>
          ${matches.map(m => `
            <div class="dup-row">
              <span><b>${esc(m.key)}</b>:${esc(m.title)}</span>
              <button type="button" class="btn btn-sm btn-brand" data-dup-vote="${m.id}">+1 Me Too (${m.votes.length})</button>
            </div>
          `).join('')}
        </div>
      `;
      $$('[data-dup-vote]', box).forEach(btn => {
        btn.onclick = () => {
          toggleVote(btn.dataset.dupVote);
          closeModal();
        };
      });
    };

    $('#repPhotos').onchange = async e => { sync(); for (const file of [...e.target.files].slice(0, 4)) { draft.photos.push(await compressPhoto(file)); } paint(); }; $$('[data-rm-photo]', box).forEach(btn => {
      btn.onclick = () => {
        sync();
        draft.photos.splice(Number(btn.dataset.rmPhoto), 1);
        paint();
      };
    });

    $('#submitReportBtn').onclick = () => {
      sync();
      if (!draft.title.trim()) {
        $('#repTitle').focus();
        toast('Please write a short one-line summary');
        return;
      }
      if (!S.profile.name && $('#repUserName')) {
        S.profile.name = $('#repUserName').value.trim();
      }
      S.counter++;
      const newIssue = {
        id: 'i_' + Date.now(),
        key: 'M9-' + String(S.counter).padStart(3, '0'),
        title: draft.title.trim(),
        kind: draft.kind,
        part: draft.part,
        severity: draft.kind === 'wish' ? 'low' : draft.severity,
        status: 'open',
        notes: draft.notes.trim(),
        reply: '',
        reporter: S.profile.name || 'Pioneer Tester',
        serial: S.profile.serial || '—',
        firmware: S.profile.firmware || '2.4.1',
        votes: [S.profile.id],
        photos: draft.photos,
        comments: [],
        createdAt: Date.now()
      };
      S.issues.unshift(newIssue);
      saveState();
      closeModal();
      renderApp();
      toast(`Sent ${newIssue.key} to ANTHBOT!`);
    };
  }

  paint();
  $('#modalBackdrop').classList.add('open');
}

/* ==========================================================
   DETAIL & DISCUSSION MODAL
   ========================================================== */
function openDetailModal(id) {
  const item = S.issues.find(x => x.id === id);
  if (!item) return;

  const k = KINDS.find(x => x.id === item.kind) || KINDS[0];
  const st = STATUSES[item.status] || STATUSES.open;
  const voted = item.votes.includes(S.profile.id);
  const isAdmin = S.profile.role === 'admin';

  const box = $('#modalBox');
  box.innerHTML = `
    <div class="modal-head">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="mono">${esc(item.key)}</span>
        <span class="chip ${k.chip}">${k.emo} ${esc(k.label)}</span>
        <span class="chip ${st.chip}">${esc(st.label)}</span>
      </div>
      <button class="close-x" id="closeModal">×</button>
    </div>

    <div class="modal-body">
      <h2 style="font-size:21px;line-height:1.25">${esc(item.title)}</h2>
      <div class="mono">
        By <b>${esc(item.reporter)}</b> · ${esc(item.part)} · FW ${esc(item.firmware)} · ${ago(item.createdAt)}
      </div>

      ${item.reply ? `
        <div style="background:var(--brand-tint);border-left:4px solid var(--brand);padding:14px 16px;border-radius:10px">
          <div style="font-size:11.5px;font-weight:800;color:var(--brand-dark);text-transform:uppercase;letter-spacing:0.05em">🌱 Official ANTHBOT Response</div>
          <div style="margin-top:4px;color:var(--ink)">${esc(item.reply)}</div>
        </div>
      ` : ''}

      ${item.notes ? `
        <div style="background:var(--bg);padding:15px;border-radius:12px;white-space:pre-wrap;border:1px solid var(--line)">${esc(item.notes)}</div>
      ` : ''}

      ${item.photos && item.photos.length ? `
        <div class="thumb-row">
          ${item.photos.map(src => `<a href="${src}" target="_blank" class="thumb"><img src="${src}"></a>`).join('')}
        </div>
      ` : ''}

      ${item.status === 'fixed' ? `
        <div style="background:var(--brand-tint);border:1px solid var(--brand);padding:14px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <div><b>Fixed in latest OTA!</b> Does it work properly on your M9 Pro now?</div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-sm btn-brand" id="verifyOkBtn">✓ Confirm Fixed</button>
            <button class="btn btn-sm" id="verifyFailBtn">✕ Still Happening</button>
          </div>
        </div>
      ` : ''}

      ${isAdmin ? `
        <div style="border:1.5px dashed var(--brand);padding:16px;border-radius:12px;background:var(--bg)">
          <div class="field-label" style="color:var(--brand-dark)">🛡️ ANTHBOT Staff Triage</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
            <div>
              <label class="field-label">Status</label>
              <select id="admStatus">
                ${Object.entries(STATUSES).map(([k, v]) => `<option value="${k}" ${item.status === k ? 'selected' : ''}>${v.label}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="field-label">Severity</label>
              <select id="admSev">
                ${SEVERITIES.map(s => `<option value="${s.id}" ${item.severity === s.id ? 'selected' : ''}>${s.label}</option>`).join('')}
              </select>
            </div>
          </div>
          <label class="field-label">Official ANTHBOT Reply</label>
          <textarea id="admReply" style="min-height:60px">${esc(item.reply || '')}</textarea>
          <div style="display:flex;justify-content:space-between;margin-top:10px">
            <button class="btn btn-sm btn-brand" id="admSaveBtn">Save Update</button>
            <button class="btn btn-sm" id="admDeleteBtn" style="color:var(--danger)">Delete</button>
          </div>
        </div>
      ` : ''}

      <div style="border-top:1px solid var(--line);padding-top:16px">
        <label class="field-label">Tester Notes & Workarounds (${item.comments.length})</label>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
          ${item.comments.map(c => `
            <div style="background:var(--bg);padding:10px 14px;border-radius:10px;font-size:13.5px;border:1px solid var(--line)">
              <b>${esc(c.by)}</b> <span class="mono">· ${ago(c.at)}</span>
              <div style="margin-top:3px">${esc(c.text)}</div>
            </div>
          `).join('') || '<div class="mono">No comments yet. Share if you found a workaround!</div>'}
        </div>
        <div style="display:flex;gap:8px">
          <input type="text" id="newCommentInput" placeholder="Add a comment or workaround...">
          <button class="btn btn-sm btn-brand" id="postCommentBtn">Post</button>
        </div>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn ${voted ? 'btn-brand' : ''}" id="modalVoteBtn">
        ${voted ? '✓ Happens on My M9 Pro' : '+1 Happens on My M9 Pro'} (${item.votes.length})
      </button>
      <button class="btn" id="closeModalFoot">Done</button>
    </div>
  `;

  $('#closeModal').onclick = closeModal;
  $('#closeModalFoot').onclick = closeModal;
  $('#modalVoteBtn').onclick = () => { toggleVote(item.id); openDetailModal(item.id); };

  if ($('#verifyOkBtn')) {
    $('#verifyOkBtn').onclick = () => {
      item.status = 'verified';
      saveState();
      toast('Confirmed fixed!');
      openDetailModal(item.id);
      renderApp();
    };
    $('#verifyFailBtn').onclick = () => {
      item.status = 'open';
      item.comments.push({ by: S.profile.name || 'Tester', text: 'Tested on my M9 Pro — still happening.', at: Date.now() });
      saveState();
      toast('Re-opened report');
      openDetailModal(item.id);
      renderApp();
    };
  }

  if (isAdmin) {
    $('#admSaveBtn').onclick = () => {
      item.status = $('#admStatus').value;
      item.severity = $('#admSev').value;
      item.reply = $('#admReply').value.trim();
      saveState();
      toast('Saved ' + item.key);
      openDetailModal(item.id);
      renderApp();
    };
    $('#admDeleteBtn').onclick = () => {
      if (!confirm(`Delete ${item.key}?`)) return;
      S.issues = S.issues.filter(x => x.id !== item.id);
      saveState();
      closeModal();
      renderApp();
      toast('Deleted report');
    };
  }

  const addComment = () => {
    const txt = $('#newCommentInput').value.trim();
    if (!txt) return;
    item.comments.push({
      by: S.profile.name || (isAdmin ? 'ANTHBOT Team' : 'Pioneer Tester'),
      text: txt,
      at: Date.now()
    });
    saveState();
    openDetailModal(item.id);
    renderApp();
  };
  $('#postCommentBtn').onclick = addComment;
  $('#newCommentInput').onkeydown = e => { if (e.key === 'Enter') addComment(); };

  $('#modalBackdrop').classList.add('open');
}

function closeModal() {
  $('#modalBackdrop').classList.remove('open');
}

/* ==========================================================
   CSV EXPORT
   ========================================================== */
function exportCSV() {
  const headers = ['ID', 'Title', 'Category', 'M9 Pro System', 'Severity', 'Status', 'Votes', 'Reporter', 'Serial', 'Firmware', 'Notes', 'ANTHBOT Reply'];
  const escCSV = val => `"${String(val ?? '').replace(/"/g, '""')}"`;
  const rows = S.issues.map(i => [
    i.key, i.title, i.kind, i.part, i.severity, i.status, i.votes.length,
    i.reporter, i.serial, i.firmware, i.notes, i.reply
  ].map(escCSV).join(','));

  const blob = new Blob([headers.join(',') + '\n' + rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `anthbot-m9pro-reports-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('CSV downloaded');
}

/* ==========================================================
   GLOBAL EVENTS & INIT
   ========================================================== */
$('#topReportBtn').onclick = () => openReportModal();
$('#goHomeLogo').onclick = () => { UI.tab = 'home'; renderApp(); };
$('#themeBtn').onclick = () => {
  S.profile.theme = S.profile.theme === 'dark' ? 'light' : 'dark';
  saveState();
  applyTheme();
};
$('#modalBackdrop').onclick = e => {
  if (e.target === $('#modalBackdrop')) closeModal();
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

renderApp();
</script>
