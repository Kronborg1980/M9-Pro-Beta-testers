<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anthbot M9 Pro — Beta Test Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   M9 PRO HARDWARE PALETTE
   Taken straight off the machine: brushed silver shell,
   graphite plastic, the red STOP button, violet wheel hubs,
   bronze wordmark. Red is reserved for stop-the-line things,
   exactly as it is on the mower.
   ========================================================== */
:root{
  --steel:#F3F5F7;          /* silver shell, lit */
  --steel-2:#E7EAEE;        /* shell, shaded */
  --steel-3:#D8DDE3;        /* panel gap */
  --graphite:#23282E;       /* dark plastic — headings, primary buttons */
  --graphite-2:#39414A;
  --graphite-3:#5C6874;     /* secondary text */
  --stop:#D9342A;           /* the STOP button */
  --stop-deep:#B3261D;
  --stop-tint:#FCEDEC;
  --violet:#6E58A8;         /* wheel hubs */
  --violet-deep:#54407F;
  --violet-tint:#EFECF7;
  --bronze:#A8813C;         /* wordmark */
  --bronze-tint:#F8F2E6;

  --ink:var(--graphite);
  --body-ink:#333B44;
  --dim:var(--graphite-3);
  --line:#DFE4E9;
  --line-strong:#C7CFD7;
  --bg:#F3F5F7;
  --surface:#EAEEF2;
  --surface-2:#E1E6EB;
  --brand:var(--violet); --brand-deep:var(--violet-deep); --brand-tint:var(--violet-tint);

  /* legacy aliases so every component keeps working */
  --lime:var(--violet); --lime-deep:var(--violet-deep);
  --teal:var(--violet); --amber:var(--bronze); --coral:var(--stop); --sky:#4A6B8A;
  --txt:var(--body-ink); --txt-2:#46505A;
  --glass:#FFFFFF; --glass-2:#FAFBFC; --line-lit:var(--violet);

  --r-xl:20px; --r-l:14px; --r-m:11px; --r-s:8px;
  --shadow:0 20px 46px -24px rgba(35,40,46,.34);
  --shadow-sm:0 2px 10px -4px rgba(35,40,46,.2);
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --side:250px;

  /* surfaces that flip between day and night */
  --paper:#FFFFFF;
  --hover:rgba(255,255,255,.8);
  --side-bg:linear-gradient(100deg,#FBFCFD,#EDF0F4);
  --hero-bg:linear-gradient(140deg,#FFFFFF,#E9EDF1 60%,#DDE3E9);
  --head-bg:linear-gradient(180deg,#FCFDFE,#F2F5F8);
  --plate:linear-gradient(145deg,#FDFDFE,#C9D0D8 55%,#EDF1F5);
  --grain:rgba(150,162,173,.09);
  --solid:#23282E; --solid-hover:#39414A; --on-solid:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--body-ink);font-family:var(--body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--violet-tint);color:var(--ink)}
a{color:var(--violet-deep);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.02em;margin:0;color:var(--ink)}

/* graphite header strip with the red indicator */
.strip{background:var(--graphite);color:#fff;font-size:12.5px;display:flex;justify-content:center;gap:26px;
  padding:9px 16px;flex-wrap:wrap;align-items:center}
.strip span{opacity:.78}
.strip b{font-weight:600;opacity:1}
.strip span:first-child::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--stop);margin-right:8px;box-shadow:0 0 0 3px rgba(217,52,42,.25);vertical-align:middle}

/* ---------------- shell ---------------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;padding:22px 14px;
  border-right:1px solid var(--line-strong);z-index:50;
  background:var(--side-bg)}
.logo{display:flex;align-items:center;gap:11px;padding:2px 8px 22px}
/* the shell: brushed silver plate, graphite bezel, red stop button */
.mark{width:40px;height:40px;border-radius:12px;position:relative;flex:none;
  background:var(--plate);
  border:1px solid var(--line-strong);box-shadow:inset 0 1px 0 #fff,var(--shadow-sm)}
.mark::before{content:"";position:absolute;inset:6px 6px 13px;border-radius:5px;
  background:repeating-linear-gradient(112deg,rgba(255,255,255,.9) 0 1px,rgba(160,172,184,.35) 1px 3px)}
.mark::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:13px;height:6px;
  border-radius:3px;background:var(--stop);box-shadow:0 1px 2px rgba(179,38,29,.6)}
.logo b{font-family:var(--display);font-size:15px;font-weight:700;display:block;line-height:1.15;color:var(--ink)}
.logo span{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--bronze)}
.navlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:18px 10px 7px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:10px 12px;border-radius:var(--r-m);color:var(--body-ink);font-size:14px;font-weight:500;transition:.15s}
.navbtn svg{flex:none;color:var(--dim)}
.navbtn:hover{background:var(--hover)}
.navbtn[aria-current=true]{background:var(--solid);color:var(--on-solid);font-weight:600}
.navbtn[aria-current=true] svg{color:var(--on-solid)}
.navbtn .n{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--surface-2);padding:1px 8px;border-radius:100px;color:var(--dim)}
.navbtn[aria-current=true] .n{background:rgba(127,127,127,.28);color:var(--on-solid)}
.navbtn .n.hot{background:var(--stop);color:#fff}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-strong)}
.whoami{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-m);cursor:pointer;transition:.15s}
.whoami:hover{background:var(--hover)}
.whoami .nm{font-size:13px;font-weight:600;line-height:1.2;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami .rl{font-size:11px;color:var(--dim)}
.content{min-width:0;padding:36px 44px 90px;max-width:1200px}
.mobilebar{display:none}

/* ---------------- atoms ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--paper);border:1px solid var(--line-strong);
  color:var(--ink);padding:10px 17px;border-radius:100px;cursor:pointer;font-size:14px;font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--steel);border-color:var(--graphite-3)}
.btn.primary{background:var(--solid);color:var(--on-solid);border-color:var(--solid);font-weight:600}
.btn.primary:hover{background:var(--solid-hover);border-color:var(--solid-hover)}
/* the report button is the red stop button — same job, same colour */
#newTop,.fab{background:var(--stop);border-color:var(--stop);color:#fff;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.16),0 6px 16px -8px rgba(217,52,42,.8)}
#newTop:hover,.fab:hover{background:var(--stop-deep);border-color:var(--stop-deep)}
.btn.big{padding:14px 26px;font-size:15.5px}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--surface);color:var(--ink)}
.btn.danger{color:var(--stop);border-color:#EBC3C0;background:var(--paper)}
.btn.danger:hover{background:var(--stop-tint)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l)}
.pad{padding:24px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:100px;font-size:11.5px;
  font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.key{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
.h-page{font-size:34px;font-weight:700;line-height:1.08;margin:10px 0 10px;letter-spacing:-.03em}
.h-sec{font-size:20px;font-weight:600}
.lede{color:var(--dim);max-width:66ch;margin:0;font-size:15px}
.muted{color:var(--dim)}
.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.wrap{display:flex;flex-wrap:wrap;gap:9px}
.stack{display:flex;flex-direction:column;gap:18px}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
.pagehead{margin-bottom:26px}
label.f{display:block;margin-bottom:16px}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px}
label.f .hint{font-weight:400;color:var(--dim);font-size:12px}
input[type=text],input[type=email],input[type=date],textarea,select{width:100%;background:var(--paper);border:1px solid var(--line-strong);
  border-radius:var(--r-m);padding:12px 14px;font-size:14.5px;transition:.15s;color:var(--ink)}
textarea{resize:vertical;min-height:104px;line-height:1.6}
input:focus,textarea:focus,select:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px var(--violet-tint)}
input::placeholder,textarea::placeholder{color:#96A2AD}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}

/* colour language — red stops you, violet is in motion, graphite is closed */
.sev-critical{color:var(--stop-deep);background:var(--stop-tint);border-color:#F0CCC9}
.sev-high{color:#7E5F1E;background:var(--bronze-tint);border-color:#E8DAB9}
.sev-medium{color:#3D5A76;background:#EAEFF4;border-color:#CFDBE5}
.sev-low{color:var(--dim);background:var(--surface-2);border-color:var(--line)}
.t-bug{color:var(--stop-deep);background:var(--stop-tint)}
.t-safety{color:#fff;background:var(--stop);border-color:var(--stop)}
.t-hardware{color:#7E5F1E;background:var(--bronze-tint)}
.t-feature{color:var(--violet-deep);background:var(--violet-tint)}
.t-question{color:#3D5A76;background:#EAEFF4}
.t-setup{color:#7E5F1E;background:var(--bronze-tint)}
.t-signal{color:#3D5A76;background:#EAEFF4}
.t-quality{color:var(--violet-deep);background:var(--violet-tint)}
.t-observation{color:var(--dim);background:var(--surface-2)}
.t-docs{color:var(--dim);background:var(--surface-2)}
.st-new{color:#7E5F1E;background:var(--bronze-tint)}
.st-triaged{color:#3D5A76;background:#EAEFF4}
.st-need-info{color:#7E5F1E;background:var(--bronze-tint)}
.st-confirmed{color:var(--stop-deep);background:var(--stop-tint)}
.st-in-progress{color:var(--violet-deep);background:var(--violet-tint)}
.st-fixed{color:var(--violet-deep);background:var(--violet-tint);border-color:#D5CDEA}
.st-verified{color:var(--on-solid);background:var(--solid)}
.st-wont-fix,.st-duplicate{color:var(--dim);background:var(--surface-2)}

/* ---------------- home ---------------- */
/* brushed-metal hero, like the top plate of the machine */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--line-strong);
  background:var(--hero-bg);padding:38px 40px;box-shadow:inset 0 1px 0 #fff}
.hero::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(112deg,rgba(255,255,255,.55) 0 2px,var(--grain) 2px 6px)}
.hero>*{position:relative}
.hero h1{font-size:clamp(28px,3.6vw,44px);font-weight:700;line-height:1.04;margin:12px 0 12px;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--stop)}
.bignums{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;margin-top:28px}
.bignum{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px;transition:.16s;cursor:pointer;text-align:left}
.bignum:hover{border-color:var(--graphite-3);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
.bignum .n{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:-.03em}
.bignum .l{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.35}
.bignum.alert{border-color:#EBC3C0;background:var(--stop-tint)}
.bignum.alert .n{color:var(--stop)}
.bignum.good .n{color:var(--violet-deep)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:18px}
.door{display:flex;flex-direction:column;gap:11px;text-align:left;padding:26px;border-radius:var(--r-l);
  border:1px solid var(--line);background:var(--paper);cursor:pointer;transition:.18s}
.door:hover{transform:translateY(-3px);border-color:var(--graphite-3);box-shadow:var(--shadow)}
.door .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--stop-tint);color:var(--stop)}
.door.b .ic{background:var(--violet-tint);color:var(--violet-deep)}
.door.c .ic{background:var(--surface);color:var(--graphite-2)}
.door.d .ic{background:var(--bronze-tint);color:var(--bronze)}
.door h3{font-size:17.5px;font-weight:600}
.door p{margin:0;font-size:13.5px;color:var(--dim);line-height:1.5}
.notice{border:1px solid var(--line);border-left:4px solid var(--stop);border-radius:var(--r-l);padding:22px 24px;
  background:var(--paper);display:flex;gap:16px;align-items:flex-start;box-shadow:var(--shadow-sm)}
.notice .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--stop-tint);color:var(--stop);flex:none}

/* ---------------- list ---------------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px}
.search input{padding-left:40px;border-radius:100px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim)}
.toolbar select{width:auto;min-width:145px;padding:11px 34px 11px 15px;font-size:13.5px;border-radius:100px}
.quickfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.qf{background:var(--paper);border:1px solid var(--line-strong);padding:8px 15px;border-radius:100px;cursor:pointer;font-size:13px;color:var(--body-ink);transition:.15s}
.qf:hover{border-color:var(--graphite-3)}
.qf[aria-pressed=true]{background:var(--solid);color:var(--on-solid);border-color:var(--solid);font-weight:500}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:68px 1fr 200px;gap:20px;padding:18px 20px;cursor:pointer;border-radius:var(--r-l);
  border:1px solid var(--line);background:var(--paper);transition:.15s}
.item:hover{border-color:var(--graphite-3);box-shadow:var(--shadow-sm)}
.item.pinned{border-color:var(--bronze);background:linear-gradient(100deg,var(--bronze-tint),var(--paper) 45%)}
.item.crit{box-shadow:inset 4px 0 0 var(--stop)}
.item.crit:hover{box-shadow:inset 4px 0 0 var(--stop),var(--shadow-sm)}
.vote{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r-m);
  border:1px solid var(--line-strong);background:linear-gradient(180deg,var(--paper),var(--surface));padding:10px 0;cursor:pointer;transition:.15s;color:var(--ink)}
.vote:hover{border-color:var(--violet);background:var(--violet-tint)}
.vote.on{background:var(--violet);border-color:var(--violet);color:#fff}
.vote .v{font-family:var(--display);font-size:19px;font-weight:700;line-height:1}
.vote .lbl{font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.8;margin-top:3px}
.item h3{font-size:16.5px;font-weight:600;margin-bottom:9px;line-height:1.3}
.item .meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.item .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:center;text-align:right}
.empty{text-align:center;padding:64px 24px;border:1px dashed var(--line-strong);border-radius:var(--r-l);background:var(--surface)}
.empty .big{font-family:var(--display);font-size:20px;margin-bottom:8px;color:var(--ink)}
.avatar{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--display);color:#fff}

/* status track */
.track{display:flex;align-items:center;margin:6px 0 2px}
.track .s{flex:1;text-align:center;position:relative;font-size:11px;color:var(--dim);padding-top:22px}
.track .s::before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:11px;height:11px;
  border-radius:50%;background:var(--paper);border:2px solid var(--line-strong);z-index:2}
.track .s::after{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--line-strong);z-index:1}
.track .s:first-child::after{display:none}
.track .s.done{color:var(--body-ink)}
.track .s.done::before{background:var(--violet);border-color:var(--violet)}
.track .s.done::after{background:var(--violet)}
.track .s.at{color:var(--violet-deep);font-weight:600}
.track .s.at::before{background:var(--violet);border-color:var(--violet);box-shadow:0 0 0 4px var(--violet-tint)}

/* ---------------- panel ---------------- */
.scrim{position:fixed;inset:0;background:rgba(35,40,46,.45);z-index:90;opacity:0;pointer-events:none;transition:.22s}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);z-index:100;display:flex;flex-direction:column;
  background:var(--paper);border-left:1px solid var(--line-strong);box-shadow:-24px 0 60px -30px rgba(35,40,46,.4);
  transform:translateX(102%);transition:transform .3s cubic-bezier(.3,.9,.3,1)}
.panel.open{transform:none}
.p-head{padding:24px 28px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start;
  background:var(--head-bg)}
.p-body{overflow:auto;padding:26px 28px;flex:1;overscroll-behavior:contain;background:var(--surface)}
.p-foot{padding:16px 28px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;background:var(--paper)}
.close-x{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;font-size:24px;line-height:1;padding:2px 9px;border-radius:8px}
.close-x:hover{color:var(--ink);background:var(--surface)}
.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;margin:14px 0}
.block h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:11px;font-weight:600}
.pre{white-space:pre-wrap;font-size:14.5px;line-height:1.65;margin:0;color:var(--body-ink)}
.kv{display:grid;grid-template-columns:136px 1fr;gap:9px 14px;font-size:13.5px}
.kv dt{color:var(--dim);font-size:12.5px}
.kv dd{margin:0;color:var(--ink)}
.staffbox{border:1px solid var(--line);border-top:3px solid var(--violet);background:var(--paper);border-radius:var(--r-l);padding:22px;margin:16px 0}
.comment{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.comment:last-of-type{border:0}
.badge-staff{background:var(--solid);color:var(--on-solid);font-size:9.5px;padding:2px 7px;border-radius:5px;font-weight:700;text-transform:uppercase;margin-left:7px;letter-spacing:.04em}
.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:var(--r-m);border:1px solid var(--line);cursor:zoom-in}
.timeline{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 16px 18px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-26px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--violet)}
.internal{background:var(--bronze-tint);border:1px dashed #E0CFA8}

/* wizard */
.steps{display:flex;gap:8px;margin-bottom:26px}
.steps span{flex:1;height:4px;border-radius:100px;background:var(--surface-2)}
.steps span.on{background:var(--violet)}
.stepq{font-family:var(--display);font-size:25px;font-weight:600;margin-bottom:7px;line-height:1.2;color:var(--ink);letter-spacing:-.02em}
.stephelp{color:var(--dim);font-size:14px;margin:0 0 22px}
.picks{display:grid;gap:12px}
.picks.two{grid-template-columns:1fr 1fr}
.picks.three{grid-template-columns:repeat(3,1fr)}
.pick{display:flex;gap:15px;align-items:flex-start;text-align:left;padding:18px 20px;border-radius:var(--r-l);
  border:1px solid var(--line-strong);background:var(--paper);cursor:pointer;transition:.16s;width:100%}
.pick:hover{border-color:var(--violet);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
.pick[aria-pressed=true]{border-color:var(--violet);background:var(--violet-tint);box-shadow:inset 0 0 0 1px var(--violet)}
.pick .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--surface)}
.pick b{display:block;font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:4px;color:var(--ink)}
.pick small{color:var(--dim);font-size:12.5px;line-height:1.45;display:block}
.pick.col{flex-direction:column;align-items:center;text-align:center;gap:10px;padding:20px 12px}
.pick.col b{font-size:13.5px}
.dupwarn{background:var(--bronze-tint);border:1px solid #E0CFA8;border-radius:var(--r-m);padding:16px 18px;margin-bottom:20px}
.dupwarn .d{padding:9px 0;cursor:pointer;font-size:13.5px;border-bottom:1px solid #EBDFC5;color:var(--ink)}
.dupwarn .d:last-child{border:0}
.dupwarn .d:hover{color:var(--violet-deep)}

/* boards, releases, checklist, tables */
.board{display:grid;grid-template-columns:repeat(5,minmax(196px,1fr));gap:14px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;min-height:200px}
.col.over{border-color:var(--violet);background:var(--violet-tint)}
.col h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  margin-bottom:13px;display:flex;gap:8px;align-items:center;font-weight:600}
.col h3 .n{margin-left:auto}
.mini{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:.15s}
.mini:hover{border-color:var(--violet);box-shadow:var(--shadow-sm)}
.mini .t{font-size:13.5px;font-weight:500;line-height:1.4;margin-bottom:10px;color:var(--ink)}
.rank{font-family:var(--display);font-size:14px;font-weight:700;color:var(--violet-deep);margin-right:7px}
.rel{border-left:2px solid var(--line-strong);padding:0 0 28px 26px;position:relative;margin-left:9px}
.rel::before{content:"";position:absolute;left:-8px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 4px var(--violet-tint)}
.rel.beta::before{background:var(--bronze);box-shadow:0 0 0 4px var(--bronze-tint)}
.ver{font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.fixlist{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.fixlist li{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:11px 14px;background:var(--paper);border-radius:var(--r-m);border:1px solid var(--line)}
.check{display:flex;gap:15px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--paper);margin-bottom:10px;align-items:flex-start}
.check.pass{border-color:#CFC7E4;background:#F7F5FC}
.check.fail{border-color:#EBC3C0;background:var(--stop-tint)}
.check.blocked{border-color:#E0CFA8;background:var(--bronze-tint)}
.check .n{font-family:var(--mono);font-size:11px;color:var(--dim);padding-top:4px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:100px;overflow:hidden}
.seg button{background:var(--paper);border:0;padding:8px 16px;font-size:12.5px;cursor:pointer;color:var(--dim);transition:.15s}
.seg button:hover{background:var(--surface);color:var(--ink)}
.seg button.on{background:var(--violet);color:#fff;font-weight:600}
.seg button.on.f{background:var(--stop)}
.seg button.on.b{background:var(--bronze)}
.progress{height:8px;border-radius:100px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.progress div{height:100%;background:var(--violet);transition:width .5s}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-l)}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;min-width:920px;background:var(--paper)}
table.data th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  padding:13px 14px;border-bottom:1px solid var(--line-strong);font-weight:600;white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:2}
table.data td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body-ink)}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover td{background:var(--steel)}
.subtabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;align-items:center}
.subtab{background:var(--paper);border:1px solid var(--line-strong);padding:9px 17px;border-radius:100px;cursor:pointer;font-size:13.5px;color:var(--body-ink);transition:.15s}
.subtab:hover{border-color:var(--graphite-3)}
.subtab[aria-current=true]{background:var(--solid);color:var(--on-solid);border-color:var(--solid);font-weight:500}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.bar-row{display:grid;grid-template-columns:136px 1fr 38px;align-items:center;gap:12px;font-size:13px}
.bar-track{height:9px;border-radius:100px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:100px;background:var(--violet)!important;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.tagpill{background:var(--surface-2);border:1px solid var(--line);padding:3px 9px;border-radius:7px;font-size:11px;font-family:var(--mono);color:var(--dim)}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13.5px}
.switch input{appearance:none;width:38px;height:21px;border-radius:100px;background:var(--line-strong);position:relative;cursor:pointer;transition:.2s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--paper);transition:.2s;box-shadow:var(--shadow-sm)}
.switch input:checked{background:var(--violet)}
.switch input:checked::after{left:19px}

/* welcome + overlays */
.welcome{position:fixed;inset:0;z-index:180;display:none;place-items:center;padding:20px;background:rgba(35,40,46,.55)}
.welcome.open{display:grid}
.wbox{width:min(540px,100%);background:var(--paper);border-radius:var(--r-xl);padding:38px;box-shadow:var(--shadow);max-height:92vh;overflow:auto;
  border-top:4px solid var(--stop)}
#toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{background:var(--solid);color:var(--on-solid);border-radius:100px;padding:13px 22px;font-size:14px;box-shadow:var(--shadow);animation:pop .26s cubic-bezier(.2,1.2,.4,1)}
.toast.bad{background:var(--stop)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}}
.lightbox{position:fixed;inset:0;z-index:150;background:rgba(35,40,46,.9);display:none;place-items:center;padding:24px;cursor:zoom-out}
.lightbox.open{display:grid}
.lightbox img{max-width:100%;max-height:100%;border-radius:var(--r-l)}

/* ---------------- responsive ---------------- */
@media(max-width:1180px){
  .content{padding:30px 30px 90px}
  .item{grid-template-columns:64px 1fr 160px}
}
@media(max-width:940px){
  :root{--side:0px}
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .content{padding:22px 18px 112px}
  .strip{font-size:11.5px;gap:14px;padding:8px 12px}
  .mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--paper);
    border-top:1px solid var(--line-strong);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .mobilebar button{flex:1;background:none;border:0;color:var(--dim);font-size:10.5px;display:flex;flex-direction:column;
    align-items:center;gap:4px;padding:5px 2px;cursor:pointer;border-radius:10px}
  .mobilebar button[aria-current=true]{color:var(--stop)}
  .picks.three{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:repeat(5,82vw)}
  .item{grid-template-columns:58px 1fr;gap:14px}
  .item .right{grid-column:2;flex-direction:row;align-items:center;text-align:left}
  .grid2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{margin-bottom:10px}
  .p-head,.p-body,.p-foot{padding-left:18px;padding-right:18px}
  .hero{padding:26px 22px}
  .h-page{font-size:26px}
  .homegrid,.yougrid{grid-template-columns:1fr!important}
}
@media(max-width:560px){
  .picks.two,.picks.three{grid-template-columns:1fr}
}


/* ==========================================================
   NIGHT — the same machine under the floodlight.
   Graphite body, silver type, the STOP button still red.
   ========================================================== */
:root[data-theme="night"]{
  --steel:#20262C; --steel-2:#1A2026; --steel-3:#2C343B;
  --graphite:#0F1418; --graphite-2:#1A2026; --graphite-3:#93A2AE;
  --stop:#FF6A5D; --stop-deep:#FF8B80; --stop-tint:rgba(255,106,93,.14);
  --violet:#A78BEE; --violet-deep:#C3AEFF; --violet-tint:rgba(167,139,238,.15);
  --bronze:#D9AE62; --bronze-tint:rgba(217,174,98,.13);

  --ink:#EDF2F6; --body-ink:#CBD5DD; --dim:#8C9AA6;
  --line:#2A323A; --line-strong:#3B4650;
  --bg:#12171B; --surface:#171D22; --surface-2:#1F262D;
  --txt:#CBD5DD; --txt-2:#B4C0C9;
  --glass:#1A2026; --glass-2:#1F262D;

  --paper:#1A2026;
  --hover:rgba(255,255,255,.06);
  --side-bg:linear-gradient(100deg,#161C21,#12171B);
  --hero-bg:linear-gradient(140deg,#232B32,#1A2026 60%,#151B20);
  --head-bg:linear-gradient(180deg,#1F262D,#1A2026);
  --plate:linear-gradient(145deg,#414B55,#232B32 55%,#39434D);
  --grain:rgba(255,255,255,.05);
  --solid:#E7EDF2; --solid-hover:#FFFFFF; --on-solid:#12171B;
  --shadow:0 20px 46px -24px rgba(0,0,0,.8);
  --shadow-sm:0 2px 12px -4px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="night"] .hero::before{
  background:repeating-linear-gradient(112deg,rgba(255,255,255,.05) 0 2px,rgba(0,0,0,.12) 2px 6px)}
:root[data-theme="night"] .mark{border-color:#4A555F;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),var(--shadow-sm)}
:root[data-theme="night"] .mark::before{
  background:repeating-linear-gradient(112deg,rgba(255,255,255,.35) 0 1px,rgba(0,0,0,.35) 1px 3px)}
:root[data-theme="night"] .strip{background:#0C1014}
:root[data-theme="night"] input::placeholder,
:root[data-theme="night"] textarea::placeholder{color:#6D7C88}
/* chips: light text on a low-opacity wash instead of a pastel fill */
:root[data-theme="night"] .sev-critical,
:root[data-theme="night"] .t-bug,
:root[data-theme="night"] .st-confirmed{color:#FF9084;background:rgba(255,106,93,.15);border-color:rgba(255,106,93,.32)}
:root[data-theme="night"] .t-safety{color:#180706;background:#FF6A5D;border-color:#FF6A5D}
:root[data-theme="night"] .sev-high,
:root[data-theme="night"] .t-setup,
:root[data-theme="night"] .t-hardware,
:root[data-theme="night"] .st-new,
:root[data-theme="night"] .st-need-info{color:#E7BE79;background:rgba(217,174,98,.14);border-color:rgba(217,174,98,.3)}
:root[data-theme="night"] .sev-medium,
:root[data-theme="night"] .t-signal,
:root[data-theme="night"] .t-question,
:root[data-theme="night"] .st-triaged{color:#8FBCE0;background:rgba(143,188,224,.13);border-color:rgba(143,188,224,.28)}
:root[data-theme="night"] .sev-low,
:root[data-theme="night"] .t-observation,
:root[data-theme="night"] .t-docs,
:root[data-theme="night"] .st-wont-fix,
:root[data-theme="night"] .st-duplicate{color:var(--dim);background:rgba(255,255,255,.06);border-color:var(--line)}
:root[data-theme="night"] .t-feature,
:root[data-theme="night"] .t-quality,
:root[data-theme="night"] .st-in-progress,
:root[data-theme="night"] .st-fixed{color:#BCA6FF;background:rgba(167,139,238,.16);border-color:rgba(167,139,238,.32)}
:root[data-theme="night"] .check.pass{border-color:rgba(167,139,238,.35);background:rgba(167,139,238,.08)}
:root[data-theme="night"] .check.fail{border-color:rgba(255,106,93,.38);background:rgba(255,106,93,.08)}
:root[data-theme="night"] .check.blocked{border-color:rgba(217,174,98,.35);background:rgba(217,174,98,.07)}
:root[data-theme="night"] .dupwarn,
:root[data-theme="night"] .internal{background:rgba(217,174,98,.08);border-color:rgba(217,174,98,.32)}
:root[data-theme="night"] .item.pinned{background:linear-gradient(100deg,rgba(217,174,98,.1),var(--paper) 45%)}
:root[data-theme="night"] .empty{background:rgba(255,255,255,.03)}
:root[data-theme="night"] .btn.danger{border-color:rgba(255,106,93,.4)}
:root[data-theme="night"] #newTop,:root[data-theme="night"] .fab{color:#1A0706}

/* theme switch in the sidebar foot */
.themeswap{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);
  border-radius:100px;margin-bottom:10px}
.themeswap button{flex:1;background:none;border:0;padding:7px 6px;border-radius:100px;cursor:pointer;
  color:var(--dim);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.themeswap button:hover{color:var(--ink)}
.themeswap button[aria-current=true]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}

/* attachments — photos, clips and links */
.media{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.media .shot{position:relative;width:104px;height:104px;border-radius:var(--r-m);overflow:hidden;
  border:1px solid var(--line-strong);cursor:zoom-in;background:var(--surface)}
.media .shot img,.media .shot video{width:100%;height:100%;object-fit:cover;display:block}
.media .shot .tag{position:absolute;left:6px;bottom:6px;background:rgba(18,23,27,.82);color:#fff;
  font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:5px;letter-spacing:.06em}
.media .shot .rm{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;border:0;
  background:rgba(18,23,27,.8);color:#fff;cursor:pointer;font-size:13px;line-height:1;padding:0}
.vidlinks{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.vidlinks a{display:flex;align-items:center;gap:9px;padding:11px 14px;border:1px solid var(--line);
  border-radius:var(--r-m);background:var(--surface);font-size:13.5px;color:var(--ink);word-break:break-all}
.vidlinks a:hover{border-color:var(--violet)}
.dropzone{border:1px dashed var(--line-strong);border-radius:var(--r-m);padding:16px;text-align:center;
  background:var(--surface);transition:.15s}
.dropzone.over{border-color:var(--violet);background:var(--violet-tint)}
.dropzone p{margin:6px 0 0;font-size:12.5px;color:var(--dim)}
.meter{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden;margin-top:9px}
.meter div{height:100%;background:var(--violet)}
.meter.full div{background:var(--stop)}
.lightbox video{max-width:100%;max-height:100%;border-radius:var(--r-l)}

/* ---------------- chat ---------------- */
.chatwrap{display:grid;grid-template-columns:212px 1fr;gap:18px;align-items:start}
.chans{display:flex;flex-direction:column;gap:4px}
.chan{display:flex;align-items:flex-start;gap:9px;text-align:left;width:100%;background:none;border:1px solid transparent;
  padding:11px 13px;border-radius:var(--r-m);cursor:pointer;transition:.15s;color:var(--body-ink)}
.chan:hover{background:var(--surface)}
.chan[aria-current=true]{background:var(--paper);border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.chan b{display:block;font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink)}
.chan small{color:var(--dim);font-size:11.5px;line-height:1.35;display:block;margin-top:2px}
.chan .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.thread{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);display:flex;flex-direction:column;
  height:calc(100vh - 250px);min-height:420px}
.msgs{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:4px}
.msg{display:flex;gap:12px;padding:9px 0}
.msg .bub{flex:1;min-width:0}
.msg .who{font-size:13px;font-weight:600;color:var(--ink)}
.msg .when{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:7px;font-weight:400}
.msg .txt{font-size:14.5px;line-height:1.6;margin:3px 0 0;white-space:pre-wrap;color:var(--body-ink)}
.msg.run{padding-top:0}
.msg.run .av{visibility:hidden;height:0}
.msg .del{opacity:0;background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px;padding:0 6px;align-self:flex-start}
.msg:hover .del{opacity:1}
.msg.mine .bub{background:var(--violet-tint);border-radius:var(--r-m);padding:9px 13px;margin:-4px 0}
.daymark{display:flex;align-items:center;gap:12px;margin:16px 0 8px;color:var(--dim);font-size:11.5px}
.daymark::before,.daymark::after{content:"";flex:1;height:1px;background:var(--line)}
.composer{border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:10px;align-items:flex-end;background:var(--paper);border-radius:0 0 var(--r-l) var(--r-l)}
.composer textarea{min-height:46px;max-height:150px;border-radius:var(--r-m);padding:12px 14px;background:var(--surface)}
.localnote{font-size:12.5px;color:var(--dim);background:var(--surface);border:1px dashed var(--line-strong);
  border-radius:var(--r-m);padding:11px 14px;margin-bottom:16px}
@media(max-width:940px){
  .chatwrap{grid-template-columns:1fr}
  .chans{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .chan{min-width:160px}
  .chan small{display:none}
  .thread{height:auto;min-height:0}
  .msgs{max-height:56vh}
}
</style>

const $=(s,r=document)=>r.querySelector(s);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
function ago(t){const d=(Date.now()-t)/1000;
  if(d<60)return'just now';if(d<3600)return Math.floor(d/60)+' min ago';if(d<86400)return Math.floor(d/3600)+' hours ago';
  if(d<172800)return'yesterday';if(d<604800)return Math.floor(d/86400)+' days ago';
  return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function fdate(t){return new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h;}
function avatar(n){const i=String(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return `<span class="avatar" style="background:hsl(${hue(n)} 68% 62%)">${esc(i)}</span>`;}
const chip=(c,l,dot)=>`<span class="chip ${c}">${dot?'<span class="dot"></span>':''}${esc(l)}</span>`;
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');
  t.textContent=(bad?'⚠  ':'✓  ')+m;$('#toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.3s';t.style.opacity=0;setTimeout(()=>t.remove(),300)},2800);}

const Store={
  KEY:'anthbot_m9_v3',_mem:null,
  _ok(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}},
  async load(){if(this._ok()){try{const r=localStorage.getItem(this.KEY);return r?JSON.parse(r):null}catch(e){return null}}return this._mem},
  async save(s){if(this._ok()){try{localStorage.setItem(this.KEY,JSON.stringify(s));return true}
    catch(e){toast('Storage is full — export a backup under My details',true);return false}}this._mem=s;return true},
  async clear(){if(this._ok())localStorage.removeItem(this.KEY);this._mem=null},
  where(){return this._ok()?'this browser':'this session only'}
};

/* ---------------- attachments ----------------
   Photos and short clips are stored as data URLs in the same
   browser storage as everything else, so there is a hard ceiling
   of roughly 5 MB for the whole app. Images are squeezed down on
   the way in; clips are capped and warned about; and there is a
   link field for anything longer, which costs nothing to store.  */
const LIMITS={image:2.5e6, video:5e6};
const isVid=f=>(f.type||f.data||'').includes('video');
const kb=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.round(n/1000)+' KB';
function storageUsed(){ try{return new Blob([JSON.stringify(S)]).size}catch(e){return 0} }
const STORAGE_CAP=4.6e6;

/* shrink a photo before it ever reaches storage — a phone photo is
   3–8 MB and would eat the whole budget on its own */
function shrinkImage(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1400, sc=Math.min(1,max/Math.max(img.width,img.height));
        if(sc===1&&file.size<600000) return res(fr.result);
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        try{
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg',.82));
        }catch(e){ res(fr.result); }
      };
      img.onerror=()=>res(fr.result);
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function readRaw(file){
  return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(file)});
}
async function takeFiles(fileList,bucket){
  for(const f of [...fileList].slice(0,6)){
    const video=(f.type||'').startsWith('video');
    if(!video&&!(f.type||'').startsWith('image')){ toast(f.name+' is not a photo or video',true); continue; }
    if(video&&f.size>LIMITS.video){
      toast('That clip is '+kb(f.size)+' — too big to store. Paste a link to it instead.',true); continue;
    }
    const data=video?await readRaw(f):await shrinkImage(f);
    bucket.push({id:uid(),name:f.name,type:video?'video':'image',data});
    if(video) toast('Clip added — one or two is all the browser can hold');
  }
}
/* render stored media, read-only or with remove buttons */
function mediaHTML(files,links,editable){
  let out='';
  if(files&&files.length) out+=`<div class="media">${files.map((f,i)=>
    (isVid(f)
      ? `<span class="shot" data-play="${i}"><video src="${f.data}" muted preload="metadata"></video><span class="tag">CLIP</span>`
      : `<span class="shot" data-zoom="${i}"><img src="${f.data}" alt="${esc(f.name||'')}"><span class="tag">PHOTO</span>`)
    +(editable?`<button class="rm" data-rm="${i}" title="Remove">×</button>`:'')+`</span>`).join('')}</div>`;
  if(links&&links.length) out+=`<div class="vidlinks">${links.map((l,i)=>
    `<a href="${esc(l)}" target="_blank" rel="noopener">${ico('film',16)}<span style="flex:1">${esc(l)}</span>
     ${editable?`<button class="rm" data-rmlink="${i}" style="position:static">×</button>`:''}</a>`).join('')}</div>`;
  return out;
}
function wireMedia(root,files,links,redraw){
  if(!root)return;                       // block is absent when there is nothing to show
  $$('[data-zoom]',root).forEach(n=>n.onclick=e=>{
    if(e.target.closest('[data-rm]'))return;
    $('#lightbox').innerHTML=`<img id="lightboxImg" src="${files[+n.dataset.zoom].data}" alt="">`;
    $('#lightbox').classList.add('open')});
  $$('[data-play]',root).forEach(n=>n.onclick=e=>{
    if(e.target.closest('[data-rm]'))return;
    $('#lightbox').innerHTML=`<video src="${files[+n.dataset.play].data}" controls autoplay playsinline></video>`;
    $('#lightbox').classList.add('open')});
  if(!redraw)return;
  $$('[data-rm]',root).forEach(b=>b.onclick=e=>{e.stopPropagation();files.splice(+b.dataset.rm,1);redraw()});
  $$('[data-rmlink]',root).forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();links.splice(+b.dataset.rmlink,1);redraw()});
}

  const canAttach=r.reporter.id===S.profile.id||admin;

  $('#pHead').innerHTML=`<div style="min-width:0;flex:1">
    <div class="row" style="gap:8px;margin-bottom:9px;flex-wrap:wrap">
      <span class="key">${esc(r.key)}</span>${chip(TYPES[r.type].cls,TYPES[r.type].short)}
      ${!NO_SEVERITY.includes(r.type)?chip(SEV[r.severity].cls,SEV[r.severity].label,true):''}
      ${chip(ST[r.status].cls,ST[r.status].label)}${r.priority?`<span class="tagpill">${esc(r.priority)}</span>`:''}</div>
    <h2 style="font-size:21px;font-weight:600;line-height:1.25">${esc(r.title)}</h2>
    <p class="muted tiny" style="margin:8px 0 0">Reported by ${esc(r.reporter.name)} · ${fdate(r.createdAt)}</p>
  </div><button class="close-x" id="pClose" aria-label="Close">×</button>`;

  $('#pBody').innerHTML=`
    ${!isWish(r)?`<div class="block"><h4>Where it is in the queue</h4>
      <div class="track">${TRACK.map((t,i)=>
        `<div class="s ${i<at?'done':''} ${i===at?'at':''}">${t}</div>`).join('')}</div></div>`:''}

    ${r.reply?`<div class="block" style="border-left:4px solid var(--violet);background:var(--violet-tint)">
      <h4>Anthbot's answer</h4><p class="pre">${nl(r.reply)}</p>
      ${r.fixedIn?`<div style="margin-top:11px">${chip('st-fixed','Fixed in '+r.fixedIn)}
        ${upd?`<span class="muted tiny"> — released ${new Date(upd.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>`:''}</div>`:''}</div>`:''}

    ${r.body?`<div class="block"><h4>What happened</h4><p class="pre">${nl(r.body)}</p></div>`:''}
    ${r.steps?`<div class="block"><h4>How to make it happen again</h4><p class="pre">${nl(r.steps)}</p></div>`:''}
    ${(r.files.length||(r.links||[]).length||canAttach)?`<div class="block"><h4>Photos and video</h4>
      <div id="rMedia">${mediaHTML(r.files,r.links,false)||'<p class="muted tiny" style="margin:0">Nothing attached yet.</p>'}</div>
      ${canAttach?`<div class="row" style="margin-top:12px;flex-wrap:wrap">
        <input type="file" id="rAdd" accept="image/*,video/*" multiple style="flex:1;min-width:200px">
        <input type="text" id="rAddLink" placeholder="or paste a video link" style="flex:1;min-width:180px">
        <button class="btn sm" id="rAddLinkBtn">Add link</button></div>`:''}
    </div>`:''}

    <div class="block"><h4>The details</h4><dl class="kv">
      <dt>Part of the mower</dt><dd>${esc(r.area)}</dd>
      <dt>How often</dt><dd>${esc(r.often||'—')}</dd>
      ${r.ground.length?`<dt>Ground</dt><dd>${esc(r.ground.join(', '))}</dd>`:''}
      <dt>Firmware</dt><dd class="key">${esc(r.reporter.firmware||'—')}</dd>
      <dt>App version</dt><dd class="key">${esc(r.reporter.app||'—')}</dd>
      ${admin?`<dt>Unit serial</dt><dd class="key">${esc(r.reporter.serial||'—')}</dd>
        <dt>Email</dt><dd class="key">${esc(r.reporter.email||'—')}</dd>
        <dt>Country</dt><dd>${esc(r.reporter.region||'—')}</dd>
        <dt>Lawn size</dt><dd>${esc(r.reporter.lawn||'—')} m²</dd>`:''}
    </dl></div>

    ${admin?`<div class="staffbox"><div class="eyebrow" style="color:var(--violet-deep)">Anthbot controls — testers cannot see this box</div>
      <div class="grid2" style="margin-top:16px">
        <label class="f"><span>Status</span><select id="aStatus">${Object.entries(ST).map(([k,v])=>
          `<option value="${k}" ${r.status===k?'selected':''}>${v.label}</option>`).join('')}</select></label>
        <label class="f"><span>Priority</span><select id="aPrio"><option value="">Not set</option>
          ${Object.entries(PRIO).map(([k,v])=>`<option value="${k}" ${r.priority===k?'selected':''}>${v}</option>`).join('')}</select></label>
        <label class="f"><span>Who owns it</span><input type="text" id="aOwner" value="${esc(r.owner)}" placeholder="Firmware team"></label>
        <label class="f"><span>Fixed in build</span><input type="text" id="aFixed" value="${esc(r.fixedIn)}" placeholder="2.5.0"></label>
      </div>
      <label class="f"><span>Answer the group <span class="hint">— shown at the top of this report for everyone</span></span>
        <textarea id="aReply" placeholder="What you found, what changed, what you need from testers.">${esc(r.reply)}</textarea></label>
      <label class="f"><span>Internal note <span class="hint">— Anthbot only</span></span>
        <textarea class="internal" id="aInternal" style="min-height:72px">${esc(r.internal)}</textarea></label>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn primary" id="aSave">Save changes</button>
        <label class="switch"><input type="checkbox" id="aPin" ${r.pinned?'checked':''}> Pin to the top</label>
      </div></div>`:''}

    <div class="block"><h4>What happened next</h4>
      <ul class="timeline">${(r.history.length?r.history:[{at:r.createdAt,text:'Reported',by:r.reporter.name}])
        .slice().reverse().map(h=>`<li><strong>${esc(h.text)}</strong>
          <div class="muted tiny">${esc(h.by)} · ${fdate(h.at)}</div></li>`).join('')}</ul></div>

    <div class="block"><h4>Replies (${r.comments.length})</h4>
      ${r.comments.map(c=>`<div class="comment">${avatar(c.by)}<div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13.5px">${esc(c.by)}${c.role==='admin'?'<span class="badge-staff">Anthbot</span>':''}
        <span class="muted tiny" style="font-weight:400"> · ${ago(c.at)}</span></div>
        <p class="pre" style="margin-top:5px">${nl(c.text)}</p></div></div>`).join('')
        ||'<p class="muted tiny">No replies yet. Even “happens to me too, on flat ground” is useful.</p>'}
      <textarea id="cText" placeholder="Add what you saw, or a workaround you found" style="margin-top:14px"></textarea>
      <button class="btn primary sm" id="cAdd" style="margin-top:10px">Post reply</button>
    </div>`;

  $('#pFoot').innerHTML=`
    <button class="btn ${mine(r)?'primary':''}" id="vBtn">${mine(r)?'✓ You have this too':(isWish(r)?'I want this too':'Same happens to me')} · ${r.votes.length}</button>
    ${r.status==='fixed'?`<button class="btn" id="okBtn">It works now</button>
      <button class="btn danger" id="badBtn">Still broken</button>`:''}
    ${(r.reporter.id===S.profile.id||admin)?`<button class="btn ghost sm danger" id="delBtn" style="margin-left:auto">Delete</button>`:''}`;

  openPanel();
  $('#pClose').onclick=closePanel;
  $('#vBtn').onclick=()=>vote(r.id);
  wireMedia($('#rMedia'),r.files,r.links,null);
  if(canAttach){
    $('#rAdd').onchange=async e=>{
      await takeFiles(e.target.files,r.files);r.updatedAt=Date.now();
      await persist();openReport(id);};
    const add=async()=>{
      let v=$('#rAddLink').value.trim();if(!v)return;
      if(!/^https?:\/\//i.test(v))v='https://'+v;
      r.links.push(v);r.updatedAt=Date.now();await persist();openReport(id);};
    $('#rAddLinkBtn').onclick=add;
    $('#rAddLink').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
  }
  if($('#okBtn'))$('#okBtn').onclick=async()=>{r.status='verified';r.updatedAt=Date.now();
    r.history.push({at:Date.now(),text:'Confirmed fixed by a tester',by:S.profile.name||'A tester'});
    log('confirmed '+r.key+' is fixed');await persist();openReport(id);refresh();toast('Thank you — marked as confirmed')};
  if($('#badBtn'))$('#badBtn').onclick=async()=>{r.status='confirmed';r.updatedAt=Date.now();
    r.history.push({at:Date.now(),text:'Reopened — still happening after the fix',by:S.profile.name||'A tester'});
    r.comments.push({id:uid(),by:S.profile.name||'A tester',role:'tester',at:Date.now(),text:'Still happening after the fix.'});
    await persist();openReport(id);refresh();toast('Reopened — Anthbot will see it')};
  if($('#delBtn'))$('#delBtn').onclick=async()=>{if(!confirm('Delete '+r.key+'? This cannot be undone.'))return;
    S.reports=S.reports.filter(x=>x.id!==r.id);await persist();closePanel();refresh();toast(r.key+' deleted')};
  $('#cAdd').onclick=async()=>{const t=$('#cText').value.trim();if(!t)return;
    r.comments.push({id:uid(),by:S.profile.name||'A tester',role:S.profile.role,at:Date.now(),text:t});
    r.updatedAt=Date.now();log('replied on '+r.key);await persist();openReport(id);toast('Reply posted')};
  if(admin)$('#aSave').onclick=async()=>{
    const was=r.status;r.status=$('#aStatus').value;
    r.priority=$('#aPrio').value;r.owner=$('#aOwner').value.trim();r.fixedIn=$('#aFixed').value.trim();
    r.reply=$('#aReply').value.trim();r.internal=$('#aInternal').value.trim();r.pinned=$('#aPin').checked;
    r.history.push({at:Date.now(),text:was!==r.status?ST[r.status].label:'Updated by Anthbot',by:'Anthbot'});
    r.updatedAt=Date.now();log('updated '+r.key);await persist();openReport(id);refresh();toast(r.key+' updated')};
}

/* ---------------- REPORT WIZARD ---------------- */
function wizard(type){
  ui.wiz={step:0,type:type||'',severity:'',area:'',often:'Now and then',ground:[],title:'',body:'',steps:'',links:[]};
  ui.files=[];
  if(type)ui.wiz.step=NO_SEVERITY.includes(type)?2:1;
  drawWiz();openPanel();
}
function drawWiz(){
  const w=ui.wiz;
  const total=4;
  const stepIndex=Math.min(w.step,3);
  $('#pHead').innerHTML=`<div style="flex:1">
    <div class="eyebrow">New report · step ${stepIndex+1} of ${total}</div>
    <h2 style="font-size:20px;font-weight:600;margin-top:6px">Tell Anthbot what you found</h2></div>
    <button class="close-x" id="pClose" aria-label="Close">×</button>`;
  let body='',foot='';
  const steps=`<div class="steps">${[0,1,2,3].map(i=>`<span class="${i<=stepIndex?'on':''}"></span>`).join('')}</div>`;

  if(w.step===0){
    body=steps+`<div class="stepq">What kind of thing is it?</div>
      <p class="stephelp">Pick the one that fits best. You can change it later.</p>
      <div class="picks two">${Object.entries(TYPES).map(([k,t])=>
        `<button class="pick" data-type="${k}" aria-pressed="${w.type===k}">
          <span class="ic ${t.cls}" style="border:0">${ico(t.ic,20)}</span>
          <span><b>${t.label}</b><small>${t.help}</small></span></button>`).join('')}</div>`;
  }
  else if(w.step===1){
    body=steps+`<div class="stepq">How bad is it?</div>
      <p class="stephelp">Be honest — this is what decides whether Anthbot looks at it today or next month.</p>
      <div class="picks two">${Object.entries(SEV).map(([k,s])=>
        `<button class="pick" data-sev="${k}" aria-pressed="${w.severity===k}">
          <span class="ic ${s.cls}" style="border:0">${ico(s.ic,20)}</span>
          <span><b>${s.title}</b><small>${s.help}</small></span></button>`).join('')}</div>`;
  }
  else if(w.step===2){
    body=steps+`<div class="stepq">Which part of the mower?</div>
      <p class="stephelp">Roughly is fine. Pick “Something else” if nothing fits.</p>
      <div class="picks three">${AREAS.map(a=>
        `<button class="pick col" data-area="${esc(a.n)}" aria-pressed="${w.area===a.n}">
          <span class="ic">${ico(a.ic,20)}</span><b>${esc(a.n)}</b></button>`).join('')}</div>`;
  }
  else{
    body=steps+`<div class="stepq">Now describe it</div>
      <p class="stephelp">Plain words are perfect. The first line is what everyone sees in the list.</p>
      <div id="dup"></div>
      <label class="f"><span>In one line, what happened?</span>
        <input type="text" id="wTitle" maxlength="110" value="${esc(w.title)}" placeholder="The blade stops in wet grass after 20 minutes"></label>
      <label class="f"><span>Tell the story <span class="hint">— where you were, what you saw or heard</span></span>
        <textarea id="wBody" placeholder="I started zone 2 at nine in the morning. The grass was still damp...">${esc(w.body)}</textarea></label>
      ${!NO_SEVERITY.includes(w.type)?`
      <label class="f"><span>How can Anthbot make it happen again? <span class="hint">— optional, but this is what gets it fixed fastest</span></span>
        <textarea id="wSteps" style="min-height:78px" placeholder="1. Start zone 2&#10;2. Wait for the north turn&#10;3. Watch the front left wheel">${esc(w.steps)}</textarea></label>
      <label class="f"><span>How often does it happen?</span>
        <select id="wOften">${HOW_OFTEN.map(o=>`<option ${w.often===o?'selected':''}>${o}</option>`).join('')}</select></label>
      <label class="f"><span>What was the ground like? <span class="hint">— tap any that apply</span></span>
        <div class="wrap" id="wGround">${GROUND.map(g=>
          `<button type="button" class="qf" data-g="${esc(g)}" aria-pressed="${w.ground.includes(g)}">${esc(g)}</button>`).join('')}</div></label>`:''}
      <label class="f"><span>Photos and video <span class="hint">— optional, and worth more than any description</span></span>
        <div class="dropzone" id="wDrop">
          <input type="file" id="wFiles" accept="image/*,video/*" multiple>
          <p>Drag them here, or use the button. Photos are shrunk automatically. Clips must be under 5 MB — for anything longer, paste a link below.</p>
        </div></label>
      <div id="wMedia"></div>
      <label class="f" style="margin-top:14px"><span>Link to a longer video <span class="hint">— YouTube, Drive, Dropbox, anything</span></span>
        <div class="row"><input type="text" id="wLink" placeholder="https://youtu.be/..." style="flex:1">
        <button class="btn sm" type="button" id="wAddLink">Add</button></div></label>
      <p class="muted tiny">Filed as <strong>${esc(S.profile.name||'Unnamed tester')}</strong>${S.profile.serial?' · unit '+esc(S.profile.serial):''} · firmware ${esc(S.profile.firmware||'—')}. Anthbot sees your name, email and serial with every report.</p>`;
  }

  foot=`${w.step>0?'<button class="btn ghost" id="wBack">Back</button>':'<button class="btn ghost" id="wCancel">Cancel</button>'}
    ${w.step<3?`<button class="btn primary" id="wNext" style="margin-left:auto">Next</button>`
              :`<button class="btn primary big" id="wSend" style="margin-left:auto">Send report</button>`}`;
  $('#pBody').innerHTML=body;$('#pFoot').innerHTML=foot;
  $('#pClose').onclick=closePanel;
  if($('#wCancel'))$('#wCancel').onclick=closePanel;
  if($('#wBack'))$('#wBack').onclick=()=>{w.step--;if(w.step===1&&NO_SEVERITY.includes(w.type))w.step=0;drawWiz()};
  const next=()=>{
    if(w.step===0&&!w.type)return toast('Pick one first',true);
    if(w.step===1&&!w.severity)return toast('Pick how bad it is',true);
    if(w.step===2&&!w.area)return toast('Pick a part of the mower',true);
    w.step++;
    if(w.step===1&&NO_SEVERITY.includes(w.type)){w.severity='low';w.step=2;}
    drawWiz();
  };
  if($('#wNext'))$('#wNext').onclick=next;
  $$('[data-type]').forEach(b=>b.onclick=()=>{w.type=b.dataset.type;next()});
  $$('[data-sev]').forEach(b=>b.onclick=()=>{w.severity=b.dataset.sev;next()});
  $$('[data-area]').forEach(b=>b.onclick=()=>{w.area=b.dataset.area;next()});
  $$('#wGround [data-g]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.g,i=w.ground.indexOf(g);
    i>=0?w.ground.splice(i,1):w.ground.push(g);
    b.setAttribute('aria-pressed',String(i<0));});
  if(w.step===3){
    const keep=()=>{w.title=$('#wTitle').value;w.body=$('#wBody').value;
      if($('#wSteps'))w.steps=$('#wSteps').value;if($('#wOften'))w.often=$('#wOften').value;};
    $('#wBody').oninput=keep;
    const draw=()=>{
      $('#wMedia').innerHTML=mediaHTML(ui.files,w.links,true);
      wireMedia($('#wMedia'),ui.files,w.links,draw);
    };
    draw();
    $('#wFiles').onchange=async e=>{await takeFiles(e.target.files,ui.files);draw();e.target.value=''};
    const dz=$('#wDrop');
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
    dz.addEventListener('drop',async e=>{if(e.dataTransfer?.files?.length){await takeFiles(e.dataTransfer.files,ui.files);draw()}});
    const addLink=()=>{
      let v=$('#wLink').value.trim();if(!v)return;
      if(!/^https?:\/\//i.test(v))v='https://'+v;
      w.links.push(v);$('#wLink').value='';draw();
    };
    $('#wAddLink').onclick=addLink;
    $('#wLink').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addLink()}};
    $('#wTitle').oninput=()=>{keep();
      const words=$('#wTitle').value.toLowerCase().split(/\s+/).filter(x=>x.length>3);
      if(words.length<2){$('#dup').innerHTML='';return}
      const hits=S.reports.map(r=>({r,n:words.filter(x=>(r.title+' '+r.body).toLowerCase().includes(x)).length}))
        .filter(h=>h.n>=2).sort((a,b)=>b.n-a.n).slice(0,3);
      $('#dup').innerHTML=hits.length?`<div class="dupwarn"><strong>Wait — someone may have this already</strong>
        <p class="muted tiny" style="margin:3px 0 8px">Pressing “Same” on an existing report counts for far more than a second copy.</p>
        ${hits.map(h=>`<div class="d" data-d="${h.r.id}">${esc(h.r.key)} — ${esc(h.r.title)}
          <span class="muted">· ${h.r.votes.length} testers</span></div>`).join('')}</div>`:'';
      $$('[data-d]').forEach(d=>d.onclick=()=>openReport(d.dataset.d))};
    $('#wSend').onclick=async()=>{
      keep();
      if(!w.title.trim()){toast('One line about what happened, first',true);$('#wTitle').focus();return}
      S.counter++;
      const r={id:uid(),key:'M9-'+String(S.counter).padStart(3,'0'),title:w.title.trim(),body:w.body.trim(),
        steps:w.steps.trim(),type:w.type,severity:w.severity||'low',area:w.area,often:w.often,ground:w.ground.slice(),
        status:'new',votes:[S.profile.id],comments:[],files:ui.files.slice(),links:w.links.slice(),
        history:[{at:Date.now(),text:'Reported',by:S.profile.name||'A tester'}],
        reporter:card(),createdAt:Date.now(),updatedAt:Date.now(),
        pinned:false,fixedIn:'',reply:'',internal:'',priority:'',owner:'',
        stage:w.type==='feature'?'requested':''};
      S.reports.unshift(r);syncTester();log('reported '+r.key+' '+r.title.slice(0,40));
      await persist();closePanel();go(w.type==='feature'?'wishes':'reports');
      toast(r.key+' sent — thank you');setTimeout(()=>openReport(r.id),260)};
    setTimeout(()=>$('#wTitle').focus(),140);
  }
}

/* ---------------- UPDATES ---------------- */
function vUpdates(el){
  const list=[...S.updates].sort((a,b)=>b.date-a.date);
  el.innerHTML=`
  <div class="pagehead"><div class="eyebrow">Fixes shipped</div>
    <h1 class="h-page">What Anthbot has changed</h1>
    <p class="lede">Every firmware and app build, and exactly which of our reports it closed. When one of yours turns up here, open it and tell them whether it actually worked.</p></div>
  ${isAdmin()?'<button class="btn primary" id="newRel" style="margin-bottom:24px">Publish a build</button>':''}
  ${list.map(u=>{const fx=u.fixes.map(byId).filter(Boolean);
    return `<div class="rel ${u.status==='beta'?'beta':''}">
      <div class="row" style="gap:10px;flex-wrap:wrap">
        <span class="ver">${u.channel==='app'?'App ':'Firmware '}${esc(u.version)}</span>
        ${chip(u.status==='released'?'st-fixed':'st-need-info',u.status==='released'?'Out now':'Beta channel')}
        <span class="muted tiny">${new Date(u.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</span>
        ${isAdmin()?`<button class="btn sm ghost" data-del="${u.id}">Remove</button>`:''}</div>
      <p class="pre muted" style="margin:10px 0 0;max-width:64ch">${nl(u.notes)}</p>
      ${fx.length?`<ul class="fixlist">${fx.map(f=>`<li><span class="key">${esc(f.key)}</span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.title)}</span>
        ${chip(ST[f.status].cls,ST[f.status].label)}
        <button class="btn sm ghost" data-o="${f.id}">Open</button></li>`).join('')}</ul>`
        :'<p class="muted tiny" style="margin-top:10px">No reports linked to this build.</p>'}
    </div>`}).join('')||'<div class="empty"><div class="big">No builds yet</div><p class="muted">Anthbot posts firmware and app releases here.</p></div>'}`;
  $$('[data-o]',el).forEach(b=>b.onclick=()=>openReport(b.dataset.o));
  $$('[data-del]',el).forEach(b=>b.onclick=async()=>{if(!confirm('Remove this build?'))return;
    S.updates=S.updates.filter(u=>u.id!==b.dataset.del);await persist();vUpdates(el)});
  if($('#newRel'))$('#newRel').onclick=relForm;
}
function relForm(){
  const cands=S.reports.filter(isOpen);
  $('#pHead').innerHTML=`<div style="flex:1"><div class="eyebrow">Anthbot</div>
    <h2 style="font-size:20px;font-weight:600;margin-top:6px">Publish a build</h2></div>
    <button class="close-x" id="pClose">×</button>`;
  $('#pBody').innerHTML=`
    <div class="grid2">
      <label class="f"><span>Version</span><input type="text" id="uVer" placeholder="2.5.0"></label>
      <label class="f"><span>Channel</span><select id="uCh"><option value="firmware">Firmware</option><option value="app">Mobile app</option></select></label>
      <label class="f"><span>State</span><select id="uSt"><option value="beta">Beta channel</option><option value="released">Out now</option></select></label>
      <label class="f"><span>Date</span><input type="date" id="uDate" value="${new Date().toISOString().slice(0,10)}"></label>
    </div>
    <label class="f"><span>Release notes</span><textarea id="uNotes" placeholder="What changed, and what testers should re-check."></textarea></label>
    <label class="f"><span>Reports this build fixes <span class="hint">— each one flips to “Fixed — please check” and the reporter is asked to confirm</span></span>
      <div style="max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-m);padding:12px">
        ${cands.map(r=>`<label class="switch" style="display:flex;padding:6px 0"><input type="checkbox" class="ufix" value="${r.id}">
          <span class="key">${esc(r.key)}</span><span style="flex:1">${esc(r.title)}</span></label>`).join('')||'<span class="muted tiny">Nothing open.</span>'}
      </div></label>`;
  $('#pFoot').innerHTML=`<button class="btn ghost" id="uCancel">Cancel</button>
    <button class="btn primary" id="uSave" style="margin-left:auto">Publish</button>`;
  openPanel();
  $('#pClose').onclick=$('#uCancel').onclick=closePanel;
  $('#uSave').onclick=async()=>{
    const v=$('#uVer').value.trim();if(!v)return toast('Version number first',true);
    const fixes=$$('.ufix:checked').map(c=>c.value);
    S.updates.push({id:uid(),version:v,channel:$('#uCh').value,status:$('#uSt').value,
      date:new Date($('#uDate').value).getTime()||Date.now(),notes:$('#uNotes').value.trim(),fixes});
    fixes.forEach(id=>{const r=byId(id);if(!r)return;r.status='fixed';r.fixedIn=v;r.updatedAt=Date.now();
      r.history.push({at:Date.now(),text:'Fixed in '+v,by:'Anthbot'})});
    log('published build '+v);await persist();closePanel();go('updates');toast('Build '+v+' published')};
}

/* ---------------- TEST PLAN ---------------- */
function vPlan(el){
  const total=planTotal();
  const done=Object.values(S.checks).filter(Boolean).length;
  const fails=Object.values(S.checks).filter(v=>v==='fail').length;
  const editing=ui.planEdit&&isAdmin();
  el.innerHTML=`
  <div class="pagehead"><div class="eyebrow">Things to try</div>
    <h1 class="h-page">The test plan</h1>
    <p class="lede">${editing
      ?'You are editing the plan every tester sees. Change the wording, add cases for the next build, drop the ones that are done with. Results already recorded stay attached to the cases they belong to.'
      :'Work down the list on your own lawn and mark what you saw. If something fails, press <strong>Report this</strong> next to it — the wizard opens with the case already filled in.'}</p></div>

  ${isAdmin()?`<div class="card pad" style="margin-bottom:20px;border-top:3px solid var(--violet)">
    <div class="spread"><div>
      <div class="eyebrow" style="color:var(--violet-deep)">Anthbot only</div>
      <p style="margin:6px 0 0;font-size:14px">${editing?'Editing the plan — changes save as you make them.':'You can rewrite this plan for the group.'}</p></div>
      <div class="wrap">
        ${editing?'<button class="btn primary" id="planDone">Done editing</button>':'<button class="btn" id="planEdit">Edit the plan</button>'}
        ${editing?'<button class="btn sm ghost" id="planReset">Restore the original plan</button>':''}
      </div></div></div>`:''}

  ${!editing?`<div class="card pad" style="margin-bottom:26px">
    <div class="spread"><strong>${done} of ${total} done</strong>
      <span class="muted tiny">${fails} failing · <button class="btn sm ghost" id="resetPlan">Start over</button></span></div>
    <div class="progress"><div style="width:${total?done/total*100:0}%"></div></div>
  </div>`:''}

  ${S.plan.map((g,gi)=>`
    ${editing
      ? `<div class="row" style="margin:26px 0 12px;gap:8px">
           <input type="text" value="${esc(g.g)}" data-gname="${g.id}" style="font-family:var(--display);font-size:18px;font-weight:600;flex:1">
           <button class="btn sm ghost" data-gup="${g.id}" ${gi===0?'disabled':''} title="Move up">↑</button>
           <button class="btn sm ghost" data-gdown="${g.id}" ${gi===S.plan.length-1?'disabled':''} title="Move down">↓</button>
           <button class="btn sm ghost danger" data-gdel="${g.id}">Delete section</button>
         </div>`
      : `<h2 class="h-sec" style="margin:28px 0 12px">${esc(g.g)}</h2>`}
    ${g.items.map((it,ii)=>{
      const st=S.checks[it.id]||'';
      if(editing) return `<div class="check" style="align-items:center">
        <span class="n">${gi+1}.${ii+1}</span>
        <input type="text" value="${esc(it.t)}" data-iname="${it.id}" style="flex:1">
        <button class="btn sm ghost" data-iup="${it.id}" ${ii===0?'disabled':''} title="Move up">↑</button>
        <button class="btn sm ghost" data-idown="${it.id}" ${ii===g.items.length-1?'disabled':''} title="Move down">↓</button>
        <button class="btn sm ghost danger" data-idel="${it.id}">Remove</button></div>`;
      return `<div class="check ${st}"><span class="n">${gi+1}.${ii+1}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;margin-bottom:11px">${esc(it.t)}</div>
          <div class="row" style="flex-wrap:wrap">
            <span class="seg">
              <button data-c="${it.id}" data-v="pass" class="${st==='pass'?'on':''}">Worked</button>
              <button data-c="${it.id}" data-v="fail" class="${st==='fail'?'on f':''}">Failed</button>
              <button data-c="${it.id}" data-v="blocked" class="${st==='blocked'?'on b':''}">Could not try</button>
            </span>
            <button class="btn sm ghost" data-file="${esc(it.t)}" data-grp="${esc(g.g)}">Report this</button>
          </div></div></div>`}).join('')}
    ${editing?`<button class="btn sm" data-iadd="${g.id}" style="margin-top:4px">+ Add a case here</button>`:''}
  `).join('')}
  ${editing?'<div style="margin-top:30px"><button class="btn primary" id="gAdd">+ Add a new section</button></div>':''}
  ${!S.plan.length?`<div class="empty"><div class="big">The plan is empty</div><p class="muted">${isAdmin()?'Add a section to get started.':'Anthbot has not published a test plan yet.'}</p></div>`:''}`;

  // tester actions
  $$('[data-c]',el).forEach(b=>b.onclick=async()=>{const k=b.dataset.c;
    S.checks[k]=S.checks[k]===b.dataset.v?'':b.dataset.v;await persist();vPlan(el)});
  $$('[data-file]',el).forEach(b=>b.onclick=()=>{
    wizard('bug');ui.wiz.title=b.dataset.file;
    ui.wiz.body='From the test plan — '+b.dataset.grp+':\n'+b.dataset.file+'\n\nWhat I saw:\n';});
  if($('#resetPlan'))$('#resetPlan').onclick=async()=>{
    if(!confirm('Clear all your own results? The plan itself is not changed.'))return;
    S.checks={};await persist();vPlan(el)};

  // admin: edit mode
  if($('#planEdit'))$('#planEdit').onclick=()=>{ui.planEdit=true;vPlan(el)};
  if($('#planDone'))$('#planDone').onclick=()=>{ui.planEdit=false;vPlan(el);toast('Plan saved')};
  if(!editing)return;

  const group=id=>S.plan.find(g=>g.id===id);
  const owner=iid=>S.plan.find(g=>g.items.some(i=>i.id===iid));
  const move=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]};
  const save=async(redraw)=>{await persist();if(redraw)vPlan(el)};

  $$('[data-gname]',el).forEach(inp=>inp.onchange=async()=>{
    group(inp.dataset.gname).g=inp.value.trim()||'Untitled section';await save(false)});
  $$('[data-iname]',el).forEach(inp=>inp.onchange=async()=>{
    const g=owner(inp.dataset.iname);
    g.items.find(i=>i.id===inp.dataset.iname).t=inp.value.trim()||'Untitled case';await save(false)});

  $$('[data-gup]',el).forEach(b=>b.onclick=async()=>{
    move(S.plan,S.plan.findIndex(g=>g.id===b.dataset.gup),-1);await save(true)});
  $$('[data-gdown]',el).forEach(b=>b.onclick=async()=>{
    move(S.plan,S.plan.findIndex(g=>g.id===b.dataset.gdown),1);await save(true)});
  $$('[data-gdel]',el).forEach(b=>b.onclick=async()=>{
    const g=group(b.dataset.gdel);
    if(!confirm('Delete “'+g.g+'” and its '+g.items.length+' cases? Everyone\'s results for them go too.'))return;
    g.items.forEach(i=>delete S.checks[i.id]);
    S.plan=S.plan.filter(x=>x.id!==g.id);await save(true);toast('Section deleted')});

  $$('[data-iup]',el).forEach(b=>b.onclick=async()=>{const g=owner(b.dataset.iup);
    move(g.items,g.items.findIndex(i=>i.id===b.dataset.iup),-1);await save(true)});
  $$('[data-idown]',el).forEach(b=>b.onclick=async()=>{const g=owner(b.dataset.idown);
    move(g.items,g.items.findIndex(i=>i.id===b.dataset.idown),1);await save(true)});
  $$('[data-idel]',el).forEach(b=>b.onclick=async()=>{const g=owner(b.dataset.idel);
    g.items=g.items.filter(i=>i.id!==b.dataset.idel);
    delete S.checks[b.dataset.idel];await save(true)});

  $$('[data-iadd]',el).forEach(b=>b.onclick=async()=>{
    const g=group(b.dataset.iadd);g.items.push({id:uid(),t:'New case — describe what to try'});
    await save(true);
    const last=$$('[data-iname]',el).pop();if(last){last.focus();last.select()}});
  if($('#gAdd'))$('#gAdd').onclick=async()=>{
    S.plan.push({id:uid(),g:'New section',items:[{id:uid(),t:'New case — describe what to try'}]});
    await save(true);const g=$$('[data-gname]',el).pop();if(g){g.focus();g.select()}};
  if($('#planReset'))$('#planReset').onclick=async()=>{
    if(!confirm('Replace the plan with the original one? Everyone loses their recorded results.'))return;
    S.plan=defaultPlan();S.checks={};await save(true);toast('Original plan restored')};
}

/* ---------------- GROUP CHAT ---------------- */
const CHANNELS=[
  {id:'general', name:'General',        desc:'Anything and everything'},
  {id:'field',   name:'Out on the lawn',desc:'What your mower did today'},
  {id:'help',    name:'Help each other',desc:'Questions, settings, workarounds'},
  {id:'anthbot', name:'From Anthbot',   desc:'Notices from the team'}
];
function vChat(el){
  const ch=CHANNELS.find(c=>c.id===ui.chan)||CHANNELS[0];
  const msgs=S.chat.msgs.filter(m=>m.ch===ch.id).sort((a,b)=>a.at-b.at);
  const dayOf=t=>new Date(t).toDateString();
  let last=null,lastWho=null;
  const stream=msgs.map(m=>{
    let out='';
    if(dayOf(m.at)!==last){
      last=dayOf(m.at);lastWho=null;
      const d=new Date(m.at),today=new Date().toDateString();
      out+=`<div class="daymark">${d.toDateString()===today?'Today':d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div>`;
    }
    const run=lastWho===m.byId; lastWho=m.byId;
    const own=m.byId===S.profile.id;
    out+=`<div class="msg ${run?'run':''} ${own?'mine':''}">
      <span class="av">${avatar(m.by)}</span>
      <div class="bub">
        ${run?'':`<div class="who">${esc(m.by)}${m.role==='admin'?'<span class="badge-staff">Anthbot</span>':''}
          <span class="when">${new Date(m.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span></div>`}
        <p class="txt">${nl(m.text)}</p>
      </div>
      ${(own||isAdmin())?`<button class="del" data-del="${m.id}" title="Delete">×</button>`:''}
    </div>`;
    return out;
  }).join('');

  el.innerHTML=`
  <div class="pagehead"><div class="eyebrow">Group chat</div>
    <h1 class="h-page">Talk to the other testers</h1>
    <p class="lede">For the back and forth that does not belong in a report — “is yours doing this too?”, settings you found, what the weather did to it. Anything that turns out to be a real fault should still get its own report so it can be tracked and voted on.</p></div>
  <div class="localnote"><strong>Heads up:</strong> messages are stored on this device only. Until the group is connected to Firebase, nobody else can see what you write here — it is the room, ready and working, waiting for a backend.</div>
  <div class="chatwrap">
    <div class="chans">${CHANNELS.map(c=>`
      <button class="chan" data-ch="${c.id}" aria-current="${c.id===ch.id}">
        <span style="min-width:0"><b># ${esc(c.name)}</b><small>${esc(c.desc)}</small></span>
        <span class="cnt">${S.chat.msgs.filter(m=>m.ch===c.id).length}</span>
      </button>`).join('')}</div>
    <div class="thread">
      <div class="msgs" id="msgs">${stream||`<div class="empty" style="margin:auto"><div class="big">Nothing in # ${esc(ch.name)} yet</div>
        <p class="muted">Say the first thing.</p></div>`}</div>
      <div class="composer">
        <textarea id="msgBox" placeholder="Message # ${esc(ch.name)} — Enter sends, Shift+Enter for a new line"></textarea>
        <button class="btn primary" id="msgSend">Send</button>
      </div>
    </div>
  </div>`;

  $$('[data-ch]',el).forEach(b=>b.onclick=()=>{ui.chan=b.dataset.ch;vChat(el)});
  const box=$('#msgBox',el),list=$('#msgs',el);
  list.scrollTop=list.scrollHeight;
  const send=async()=>{
    const t=box.value.trim();if(!t)return;
    if(!S.profile.name){toast('Add your name under My details first',true);return}
    S.chat.msgs.push({id:uid(),ch:ch.id,by:S.profile.name,byId:S.profile.id,
      role:S.profile.role,text:t,at:Date.now()});
    box.value='';await persist();vChat(el);
    const l=$('#msgs',el);l.scrollTop=l.scrollHeight;$('#msgBox',el).focus();
  };
  $('#msgSend',el).onclick=send;
  box.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
  $$('[data-del]',el).forEach(b=>b.onclick=async()=>{
    S.chat.msgs=S.chat.msgs.filter(m=>m.id!==b.dataset.del);await persist();vChat(el)});
}

}

    `<button data-theme="${k}" aria-current="${pref===k}" title="${l} mode">${i?ico(i,14):''}${l}</button>`).join('');

    <thead><tr><th>ID</th><th>Title</th><th>Kind</th><th>Severity</th><th>Status</th><th>Same</th><th>Priority</th>
